<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Ninja Legends — Missions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Page loader: covers the page until its art, fonts and data are in -->
  <link rel="stylesheet" href="css/page-loader.css" />
  <script src="js/session-gate.js"></script>
  <script src="js/page-loader.js"></script>
  <script src="js/device-detect.js"></script>
  <script src="js/ui-theme.js"></script>
  <script src="js/modal-manager.js?v=3"></script>
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ninja Legends" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app/favicon-32.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme-jjk.css" />
  <link rel="stylesheet" href="css/missions.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/bottombar.css" />
  <link rel="stylesheet" href="css/tutorial.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/help-tip.css" />
  <link rel="stylesheet" href="css/story-dialogue.css" />
  <script src="js/help-tip.js"></script>
  <link rel="stylesheet" href="css/ui-glass.css" />
  <link rel="stylesheet" href="css/glass/missions.css" />
  <link rel="stylesheet" href="css/ui-ink.css" />
</head>
<body class="page-missions">
  <header class="jjk-page-header">
    <a class="jjk-icon-btn jjk-back" href="village.html" aria-label="Back to Village"><img src="assets/ui/jjk/back_arrow.webp" alt="" /></a>
    <h1 data-ink-sub="任務 · Story, events and bosses" class="jjk-title-plate">Missions</h1>
  </header>
  <!-- mission_bg.gif is actually an MP4 — use <video> for playback -->
  <video id="full-bg" autoplay muted loop playsinline
    style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(0.7);z-index:0;pointer-events:none;">
    <source src="assets/mission_bg.gif" type="video/mp4">
  </video>
  <div class="mission-page-container">
    <div class="mission-tabs"></div>
    <div class="mission-list-container">
      <div class="mission-list"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village"><img src="assets/icons/nav/village_btm_btn.png" alt="Village"></button>
      <button class="hud-button" id="btn-characters" aria-label="Shinobi"><img src="assets/icons/nav/characters_icon.png" alt="Characters" onerror="this.style.display='none'"></button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion"><img src="assets/icons/nav/fusion_btm_btn.png" alt="Fusion"></button>
      <button class="hud-button" id="btn-teams" aria-label="Teams"><img src="assets/icons/nav/teams_icon.png" alt="Teams"></button>
      <button class="hud-button" id="btn-tools" aria-label="Tools"><img src="assets/icons/nav/guilds_icon.png" alt="Tools"></button>
      <button class="hud-button" id="btn-summon" aria-label="Summon"><img src="assets/icons/nav/summon_btm_btn.png" alt="Summon"></button>
      <button class="hud-button active" id="btn-missions" aria-label="Missions"><img src="assets/icons/nav/mission_btm_btn.png" alt="Missions"></button>
      <button class="hud-button" id="btn-inventory" aria-label="Items"><img src="assets/icons/nav/inventory_icon.png" alt="Inventory"></button>
      <button class="hud-button" id="btn-shop" aria-label="Shop"><img src="assets/icons/nav/shop_btm_btn.png" alt="Shop"></button>
    </div>
  </div>

  <script src="js/vendor/howler.min.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/reward-format.js"></script>
  <script src="js/story-dialogue.js"></script>
  <script src="js/mission-progress.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/battle/battle-save.js"></script>
  <script src="js/battle-resume-prompt.js"></script>
  <!-- First-time tutorial (steps: js/tutorial-steps.js) -->
  <script src="js/tutorial-steps.js"></script>
  <script src="js/tutorial.js"></script>
</body>
</html>
