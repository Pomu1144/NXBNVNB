<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blazing — Sprite Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme-jjk.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--jjk-font); color: var(--jjk-text);
      padding: 90px 24px 32px;
    }
    .grid {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      max-width: 1400px; margin: 0 auto;
    }
    .unit { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .unit h2 { font-size: 17px; font-weight: 800; color: var(--jjk-gold-hi); }
    .stage {
      width: 100%; height: 220px; display: flex; align-items: flex-end; justify-content: center;
      background: radial-gradient(ellipse at 50% 92%, rgba(0,0,0,0.55) 0 18%, transparent 40%),
                  linear-gradient(180deg, rgba(20,60,68,0.35), rgba(4,10,12,0.6));
      border: 1px solid rgba(201,162,78,0.25);
    }
    .actions { display: flex; gap: 8px; }
    .actions .jjk-btn { min-width: 0; height: 36px; font-size: 14px; padding: 0 20px; }
    .missing { color: var(--jjk-muted); font-size: 13px; align-self: center; }
  </style>
</head>
<body class="jjk-screen-bg">
  <header class="jjk-page-header">
    <a class="jjk-icon-btn jjk-back" href="village.html" aria-label="Back"><img src="assets/ui/jjk/back_arrow.webp" alt=""></a>
    <h1 class="jjk-title-plate">Sprite Preview</h1>
  </header>

  <main class="grid" id="grid"></main>

  <script src="js/sprite-player.js"></script>
  <script>
    const UNITS = [
      { id: 'naruto_666',  name: 'Naruto Uzumaki' },
      { id: 'sasuke_662',  name: 'Sasuke Uchiha' },
      { id: 'madara_2025', name: 'Madara Uchiha' },
      { id: 'minato_2101', name: 'Minato Namikaze' },
      { id: 'itachi_2095', name: 'Itachi Uchiha' },
    ];
    const grid = document.getElementById('grid');
    UNITS.forEach(u => {
      const card = document.createElement('section');
      card.className = 'unit jjk-panel';
      card.innerHTML = `<h2>${u.name}</h2><div class="stage"></div>
        <div class="actions"><button class="jjk-btn" data-a="idle">Idle</button>
        <button class="jjk-btn" data-a="attack">Attack</button></div>`;
      grid.appendChild(card);
      const player = SpritePlayer.create(card.querySelector('.stage'), `assets/sprites/${u.id}`, { height: 200 });
      player.play('idle').catch(() => {
        card.querySelector('.stage').innerHTML = '<p class="missing">Sprites not built yet</p>';
      });
      card.querySelector('[data-a="idle"]').onclick = () => player.play('idle');
      card.querySelector('[data-a="attack"]').onclick = () => player.play('attack', { then: 'idle' });
    });
  </script>
</body>
</html>
