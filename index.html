<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blazing — Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script src="js/device-detect.js"></script>
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Blazing" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="assets/icons/achievement_icon.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme-jjk.css" />
  <link rel="stylesheet" href="css/login-overlay.css" />
  <link rel="stylesheet" href="css/loading-bridge.css" />
  <style>
    body,
    html {
      margin: 0;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #e9edf5;
      overflow: hidden;
    }
  </style>
  <link rel="stylesheet" href="css/mobile.css" />
</head>

<body>
  <!-- Loading bridge shown after login -->
  <div id="login-loading" class="loading-bridge is-hidden" role="status" aria-live="polite">
    <div class="loading-bridge__spinner" aria-hidden="true"></div>
    <div class="loading-bridge__text" data-loading-message>Preparing village HUD…</div>
  </div>

  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title" data-redirect="village.html">
    <div class="login-art" aria-hidden="true"></div>

    <div class="login-panel">
      <header class="login-brand">
        <p class="login-brand__kicker">Naruto</p>
        <h1 id="login-title" class="login-brand__word">Blazing</h1>
        <span class="login-brand__rule" aria-hidden="true"></span>
      </header>

      <div class="login-form jjk-panel" data-login-form>
        <h2 class="login-plate jjk-title-plate">Sign In</h2>
        <form>
          <label class="login-field">
            <span class="login-label">Ninja Name</span>
            <input id="login-username" data-login-username type="text" name="username" maxlength="20" placeholder="Enter your ninja name" autocomplete="username" required />
          </label>

          <label class="login-field">
            <span class="login-label">Password</span>
            <input id="login-password" data-login-password type="password" name="password" maxlength="32" placeholder="••••••••" autocomplete="current-password" required />
          </label>

          <button type="submit" class="login-primary jjk-btn">Log In</button>

          <div class="login-alt">
            <button type="button" class="login-create jjk-tab" data-login-create>Create Account</button>
            <button type="button" class="login-secondary" data-login-guest>Continue as guest</button>
          </div>

          <div class="login-feedback" data-login-feedback aria-live="polite"></div>
          <p class="login-note">Progress is saved on this device.</p>
        </form>
        <!-- Legacy quick-enter hook (handled in js/login-overlay.js); hidden, guest covers it -->
        <button type="button" data-login-fast hidden>Enter the Village</button>
      </div>
    </div>
  </div>

  <!-- Login Script -->
  <script src="js/login-overlay.js"></script>
</body>
</html>
