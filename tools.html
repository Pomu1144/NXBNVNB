<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blazing — Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Blazing" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="assets/icons/achievement_icon.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/tools.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/bottombar.css" />
</head>
<body class="page-tools">
  <div id="tools-bg"></div>
  <div id="tools-backdrop"></div>
  <main class="tools-content">
    <h1 class="page-title">TOOLS</h1>

    <!-- The mockup image is the frame; functional zones sit over its regions -->
    <div class="tools-skin-stage">
      <!-- LEFT rail: owned character roster -->
      <div class="zone zone-roster">
        <div class="tools-search-wrap">
          <span class="tools-search-ico">⚲</span>
          <input type="text" id="tools-search" class="tools-roster-search" placeholder="Search" />
        </div>
        <div class="tools-roster-list" id="tools-roster-list"></div>
      </div>

      <!-- CENTER: stars, power+grade, character art -->
      <div class="zone zone-stars" id="tools-star-row"></div>
      <div class="zone zone-power" id="tools-power-badge" style="display:none">
        <span class="tools-grade" id="tools-grade">—</span>
        <span class="tools-power-txt"><span class="tpl">POWER</span><span class="power-value" id="power-value">—</span></span>
      </div>
      <div class="zone zone-art">
        <img id="character-full-image" class="tools-art" src="" alt="" style="display:none" />
        <div class="tools-empty-hint" id="tools-empty-hint">Select a character</div>
      </div>

      <!-- Stats band -->
      <div class="zone zone-stats stats-display" id="stats-display" style="display:none">
        <div class="stat-item"><span class="stat-label">HP</span><span class="stat-value" id="stat-health">0</span></div>
        <div class="stat-item"><span class="stat-label">ATK</span><span class="stat-value" id="stat-attack">0</span></div>
        <div class="stat-item"><span class="stat-label">SPD</span><span class="stat-value" id="stat-speed">0</span></div>
      </div>

      <!-- Equipment row -->
      <div class="zone zone-equip equipment-container" id="equipment-container" style="display:none">
        <div class="equipment-slot" data-slot="1"></div>
        <div class="equipment-slot" data-slot="2"></div>
        <div class="equipment-slot" data-slot="3"></div>
        <div class="equipment-slot" data-slot="4"></div>
        <div class="equipment-slot" data-slot="5"></div>
        <div class="equipment-slot" data-slot="6"></div>
      </div>

      <!-- Name plate (lower panel) -->
      <div class="zone zone-name" id="selected-character-info" style="display:none">
        <div class="character-name" id="character-name"></div>
        <div class="character-version" id="character-version"></div>
      </div>
    </div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village"><img src="assets/icons/village_btm_btn.png" alt="Village"></button>
      <button class="hud-button" id="btn-characters" aria-label="Characters"><img src="assets/icons/characters_icon.png" alt="Characters" onerror="this.style.display='none'"></button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion"><img src="assets/icons/fusion_btm_btn.png" alt="Fusion"></button>
      <button class="hud-button" id="btn-teams" aria-label="Teams"><img src="assets/icons/teams_icon.png" alt="Teams"></button>
      <button class="hud-button active" id="btn-tools" aria-label="Tools"><img src="assets/icons/guilds_icon.png" alt="Tools"></button>
      <button class="hud-button" id="btn-summon" aria-label="Summon"><img src="assets/icons/summon_btm_btn.png" alt="Summon"></button>
      <button class="hud-button" id="btn-missions" aria-label="Missions"><img src="assets/icons/mission_btm_btn.png" alt="Missions"></button>
      <button class="hud-button" id="btn-inventory" aria-label="Inventory"><img src="assets/icons/inventory_icon.png" alt="Inventory"></button>
      <button class="hud-button" id="btn-shop" aria-label="Shop"><img src="assets/icons/shop_btm_btn.png" alt="Shop"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/character_inv.js?v=2"></script>
  <script src="js/progression.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
