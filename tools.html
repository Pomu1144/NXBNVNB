<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Ninja Legends — Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Page loader: covers the page until its art, fonts and data are in -->
  <link rel="stylesheet" href="css/page-loader.css" />
  <script src="js/session-gate.js"></script>
  <script src="js/page-loader.js"></script>
  <script src="js/device-detect.js"></script>
  <script src="js/modal-manager.js?v=3"></script>
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Ninja Legends" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app/favicon-32.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme-jjk.css" />
  <link rel="stylesheet" href="css/tools.css" />
  <link rel="stylesheet" href="css/magatama.css" />
  <link rel="stylesheet" href="css/gear.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/bottombar.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="page-tools">
  <header class="jjk-page-header">
    <a class="jjk-icon-btn jjk-back" href="village.html" aria-label="Back to Village"><img src="assets/ui/jjk/back_arrow.webp" alt="" /></a>
    <h1 class="jjk-title-plate">Tools</h1>
  </header>
  <div class="tl-views" role="tablist" aria-label="Tools view">
    <span class="jjk-chip mg-ryo" id="mg-ryo" hidden><img src="assets/icons/currency/ryo.png" alt="" /><b id="mg-ryo-val">0</b></span>
    <button type="button" class="jjk-tab tl-view active" role="tab" aria-selected="true" data-view="gear" id="view-gear">Gear</button>
    <button type="button" class="jjk-tab tl-view" role="tab" aria-selected="false" data-view="str" id="view-str">Strengthen</button>
    <button type="button" class="jjk-tab tl-view" role="tab" aria-selected="false" data-view="up" id="view-up">Upgrade</button>
    <button type="button" class="jjk-tab tl-view" role="tab" aria-selected="false" data-view="maga" id="view-maga">Magatama</button>
  </div>
  <main class="tl-app" id="tools-app">

    <!-- LEFT: owned roster -->
    <section class="tl-roster jjk-panel" aria-label="Shinobi roster">
      <div class="tl-panel-head">
        <h2 class="tl-panel-title">Shinobi</h2>
        <span class="jjk-chip tl-count" id="tools-roster-count">0</span>
      </div>
      <div class="tl-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input type="search" id="tools-search" placeholder="Search name or title" autocomplete="off" aria-label="Search roster" />
      </div>
      <div class="tl-filters">
        <label class="tl-select"><span class="sr-only">Sort by</span>
          <select id="tools-sort" aria-label="Sort roster">
            <option value="stars">Stars</option>
            <option value="level">Level</option>
            <option value="power">Power</option>
            <option value="name">Name</option>
            <option value="equipped">Equipped</option>
          </select>
        </label>
        <button type="button" class="tl-dir" id="tools-sort-dir" aria-label="Toggle sort direction" title="Toggle sort direction">&#9660;</button>
        <label class="tl-select"><span class="sr-only">Filter</span>
          <select id="tools-filter" aria-label="Filter roster">
            <option value="all">All</option>
            <option value="7">7&#9733;+</option>
            <option value="6">6&#9733;</option>
            <option value="5">5&#9733;</option>
            <option value="4">&le;4&#9733;</option>
            <option value="geared">Jutsu set</option>
            <option value="empty">No jutsu</option>
          </select>
        </label>
      </div>
      <div class="tl-roster-list" id="tools-roster-list" role="listbox" aria-label="Characters"></div>
    </section>

    <!-- CENTER: gear pieces around the art, jutsu slots below -->
    <section class="tl-stage jjk-panel" aria-label="Selected character">
      <div class="tl-stage-main">
        <div class="gp-col gp-col--l" id="gear-left" aria-label="Helmet, weapon, armor"></div>
        <div class="tl-art-frame" id="tools-art-frame">
          <img id="character-full-image" class="tl-art" src="" alt="" hidden />
          <div class="tl-empty" id="tools-empty-hint">Select a shinobi from the roster</div>
          <div class="tl-ident" id="selected-character-info" hidden>
            <div class="tl-stars" id="tools-star-row"></div>
            <div class="tl-name" id="character-name"></div>
            <div class="tl-version" id="character-version"></div>
          </div>
          <div class="tl-power" id="tools-power-badge" hidden>
            <span class="tl-grade" id="tools-grade"></span>
            <span class="tl-power-txt"><small>Power</small><b id="power-value">&mdash;</b></span>
          </div>
          <div class="tl-level jjk-chip" id="tools-level-chip" hidden></div>
        </div>
        <div class="gp-col gp-col--r" id="gear-right" aria-label="Scroll, necklace"></div>
      </div>

      <div class="tl-slots" id="equipment-container" hidden>
        <div class="tl-slot-group">
          <div class="tl-group-label">Jutsu</div>
          <div class="tl-slot-row">
            <button type="button" class="tl-slot" data-slot="jutsu1"></button>
            <button type="button" class="tl-slot" data-slot="jutsu2"></button>
            <button type="button" class="tl-slot" data-slot="jutsu3"></button>
            <button type="button" class="tl-slot tl-slot--ult" data-slot="ultimate"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT: stats + equipped list + actions -->
    <section class="tl-side jjk-panel" aria-label="Stats and gear">
      <div class="tl-panel-head">
        <h2 class="tl-panel-title">Stats</h2>
        <span class="jjk-chip tl-set" id="tools-set-bonus" hidden>7&#9733; Set +30%</span>
      </div>
      <dl class="tl-stats" id="stats-display"></dl>
      <div class="tl-panel-head tl-panel-head--sub">
        <h2 class="tl-panel-title">Equipped</h2>
        <span class="jjk-chip tl-count" id="tools-equip-count">0/4</span>
      </div>
      <ul class="tl-equipped" id="tools-equipped-list"></ul>
      <div class="tl-actions">
        <button type="button" class="jjk-btn tl-act" id="tools-auto">Auto-Equip</button>
        <button type="button" class="jjk-btn tl-act tl-act--ghost" id="tools-clear">Unequip All</button>
      </div>
    </section>
  </main>

  <!-- STRENGTHEN: level all five gear pieces with Ryo -->
  <main class="gs-app" id="str-app" hidden>
    <section class="gs-panel jjk-panel" aria-label="Equipment strengthening">
      <div class="tl-panel-head">
        <h2 class="tl-panel-title">Strengthen</h2>
        <span class="jjk-chip tl-count gs-who" id="gs-who"></span>
      </div>
      <div class="gs-head" aria-hidden="true"><span></span><span>Gear</span><span>Level</span><span>Stat</span><span>Cost</span><span></span></div>
      <div class="gs-rows" id="gs-rows"></div>
      <div class="gs-foot">
        <span class="gs-total" id="gs-total"></span>
        <button type="button" class="jjk-btn is-primary gs-all" id="gs-auto-all">Auto All</button>
      </div>
    </section>
  </main>

  <!-- UPGRADE: promote a piece to the next tier at its level cap -->
  <main class="gu-app" id="up-app" hidden>
    <section class="gu-pieces jjk-panel" aria-label="Gear">
      <div class="tl-panel-head">
        <h2 class="tl-panel-title">Gear</h2>
        <span class="jjk-chip tl-count gs-who" id="gu-who"></span>
      </div>
      <div class="gu-list" id="gu-list" role="listbox" aria-label="Gear pieces"></div>
    </section>
    <section class="gu-main jjk-panel" aria-label="Equipment upgrading">
      <div class="gu-top">
        <div class="gu-preview" id="gu-preview"></div>
        <div class="gu-stat" id="gu-stat"></div>
      </div>
      <div class="gu-use">
        <div class="gu-use-head">Use</div>
        <div class="gu-mats" id="gu-mats"></div>
      </div>
      <div class="gu-go">
        <span class="gu-note" id="gu-note"></span>
        <button type="button" class="jjk-btn is-primary gu-btn" id="gu-upgrade">Upgrade</button>
      </div>
    </section>
  </main>

  <!-- Gear piece: quick strengthen / promote -->
  <div class="tl-modal" id="gp-modal" hidden>
    <div class="tl-modal-card jjk-panel gp-card" role="dialog" aria-modal="true" aria-labelledby="gp-title">
      <div class="tl-modal-head">
        <h2 id="gp-title">Gear</h2>
        <button type="button" class="tl-x" id="gp-close" aria-label="Close">&times;</button>
      </div>
      <div class="gp-body" id="gp-body"></div>
    </div>
  </div>

  <!-- MAGATAMA: beset jewels into the selected shinobi's gear -->
  <main class="mg-app" id="maga-app" hidden>
    <section class="mg-tools jjk-panel" aria-label="Gear">
      <div class="tl-panel-head">
        <h2 class="tl-panel-title">Gear</h2>
        <span class="jjk-chip tl-count mg-who" id="mg-who"></span>
      </div>
      <div class="mg-tool-list" id="mg-tool-list" role="listbox" aria-label="Gear pieces"></div>
      <dl class="mg-total" id="mg-total"></dl>
    </section>

    <section class="mg-stage jjk-panel" aria-label="Beset">
      <div class="mg-stage-head">
        <span class="mg-tool-name" id="mg-tool-name"></span>
        <span class="mg-tool-bonus" id="mg-tool-bonus"></span>
      </div>
      <div class="mg-ring-wrap">
        <div class="mg-ring" id="mg-ring">
          <svg class="mg-ring-art" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="mgFace" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#1b4f86"/>
                <stop offset=".62" stop-color="#0c2a52"/>
                <stop offset="1" stop-color="#061631"/>
              </radialGradient>
              <linearGradient id="mgRim" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9fd4ff"/>
                <stop offset=".5" stop-color="#2f78c8"/>
                <stop offset="1" stop-color="#bfe3ff"/>
              </linearGradient>
              <path id="mgTomoe" d="M0 -10A10 10 0 1 1 -9.5 3Q-13 -9 -25 -15Q-9 -21 0 -10Z"/>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#mgFace)" stroke="url(#mgRim)" stroke-width="3"/>
            <circle cx="100" cy="100" r="88" fill="none" stroke="#5aa6e8" stroke-opacity=".35" stroke-width="1"/>
            <circle cx="100" cy="100" r="64" fill="none" stroke="#5aa6e8" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 5"/>
            <g transform="translate(100 100)"><g class="mg-tomoe" fill="#2a64a8" fill-opacity=".45">
              <use href="#mgTomoe" transform="rotate(0) translate(0 -45) scale(.95)"/>
              <use href="#mgTomoe" transform="rotate(120) translate(0 -45) scale(.95)"/>
              <use href="#mgTomoe" transform="rotate(240) translate(0 -45) scale(.95)"/>
            </g></g>
            <circle cx="100" cy="100" r="30" fill="#07152b" stroke="url(#mgRim)" stroke-width="2"/>
          </svg>
          <div class="mg-core" id="mg-core"></div>
          <div class="mg-sockets" id="mg-sockets"></div>
        </div>
      </div>
      <div class="mg-actions">
        <button type="button" class="jjk-btn mg-act" id="mg-buy">Buy</button>
        <button type="button" class="jjk-btn mg-act" id="mg-split">Split</button>
        <button type="button" class="jjk-btn mg-act" id="mg-combine">Combine</button>
        <button type="button" class="jjk-btn mg-act is-primary" id="mg-oneclick">One-Click Beset</button>
      </div>
    </section>

    <section class="mg-bag jjk-panel" aria-label="Magatama">
      <div class="mg-tabs" role="tablist">
        <button type="button" class="jjk-tab mg-tab active" role="tab" aria-selected="true" data-tab="fit" id="mg-tab-fit">Besetable</button>
        <button type="button" class="jjk-tab mg-tab" role="tab" aria-selected="false" data-tab="bag" id="mg-tab-bag">Backpack</button>
      </div>
      <div class="mg-grid" id="mg-grid" role="listbox" aria-label="Magatama"></div>
      <div class="mg-sel" id="mg-sel"></div>
    </section>
  </main>

  <!-- Buy magatama -->
  <div class="tl-modal" id="mg-shop" hidden>
    <div class="tl-modal-card jjk-panel mg-shop-card" role="dialog" aria-modal="true" aria-labelledby="mg-shop-title">
      <div class="tl-modal-head">
        <h2 id="mg-shop-title">Buy Magatama</h2>
        <button type="button" class="tl-x" id="mg-shop-close" aria-label="Close">&times;</button>
      </div>
      <div class="mg-shop-body" id="mg-shop-body"></div>
    </div>
  </div>

  <!-- Card picker (themed modal) -->
  <div class="tl-modal" id="tools-picker" hidden>
    <div class="tl-modal-card jjk-panel" role="dialog" aria-modal="true" aria-labelledby="tools-picker-title">
      <div class="tl-modal-head">
        <h2 id="tools-picker-title">Equip</h2>
        <button type="button" class="tl-x" id="tools-picker-close" aria-label="Close">&times;</button>
      </div>
      <div class="tl-current" id="tools-picker-current" hidden></div>
      <div class="tl-modal-tools">
        <div class="tl-tabs" id="tools-picker-tabs" role="tablist"></div>
        <label class="tl-search tl-search--sm">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input type="search" id="tools-picker-search" placeholder="Search cards" autocomplete="off" aria-label="Search cards" />
        </label>
      </div>
      <div class="tl-card-grid" id="tools-picker-grid"></div>
    </div>
  </div>
  <div class="tl-toast" id="tools-toast" role="status" aria-live="polite"></div>

  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village"><img src="assets/icons/nav/village_btm_btn.png" alt="Village"></button>
      <button class="hud-button" id="btn-characters" aria-label="Shinobi"><img src="assets/icons/nav/characters_icon.png" alt="Characters" onerror="this.style.display='none'"></button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion"><img src="assets/icons/nav/fusion_btm_btn.png" alt="Fusion"></button>
      <button class="hud-button" id="btn-teams" aria-label="Teams"><img src="assets/icons/nav/teams_icon.png" alt="Teams"></button>
      <button class="hud-button active" id="btn-tools" aria-label="Tools"><img src="assets/icons/nav/guilds_icon.png" alt="Tools"></button>
      <button class="hud-button" id="btn-summon" aria-label="Summon"><img src="assets/icons/nav/summon_btm_btn.png" alt="Summon"></button>
      <button class="hud-button" id="btn-missions" aria-label="Missions"><img src="assets/icons/nav/mission_btm_btn.png" alt="Missions"></button>
      <button class="hud-button" id="btn-inventory" aria-label="Items"><img src="assets/icons/nav/inventory_icon.png" alt="Inventory"></button>
      <button class="hud-button" id="btn-shop" aria-label="Shop"><img src="assets/icons/nav/shop_btm_btn.png" alt="Shop"></button>
    </div>
  </div>

  <script src="js/vendor/howler.min.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/character_inv.js?v=2"></script>
  <script src="js/progression.js"></script>
  <script src="js/lb-crystals.js"></script>
  <script src="js/limit-break.js"></script>
  <script src="js/card-levels.js"></script>
  <script src="js/jutsu-inventory.js"></script>
  <script src="js/magatama.js"></script>
  <script src="js/gear.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/tools-gear.js"></script>
  <script src="js/tools-magatama.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
