<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blazing — Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Blazing" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="assets/icons/achievement_icon.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/bottombar.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap");

    *, *::before, *::after { box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { -ms-overflow-style: none; scrollbar-width: none; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #080810;
      color: #eee6d1;
      font-family: "Cinzel", serif;
      overflow-x: hidden;
    }

    /* ── Background ─────────────────────────────────────────── */
    #arena-bg {
      position: fixed;
      inset: 0;
      background-image: url('assets/Main Background/arena_background.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
    }

    #arena-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.25) 35%,
        rgba(0,0,0,0.65) 100%
      );
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .arena-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 20px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1.arena-title {
      font-size: clamp(26px, 5vw, 52px);
      color: #d4af37;
      letter-spacing: clamp(3px, 0.6vw, 8px);
      text-shadow:
        0 4px 20px rgba(212,175,55,0.9),
        0 0 60px rgba(255,120,0,0.45),
        0 2px 4px rgba(0,0,0,0.9);
      margin: 0 0 6px;
      text-align: center;
    }

    .arena-subtitle {
      font-size: clamp(10px, 1.5vw, 14px);
      color: rgba(255,220,150,0.7);
      letter-spacing: 2px;
      margin: 0 0 28px;
      text-align: center;
    }

    /* ── Player Rank Card ───────────────────────────────────── */
    .player-rank-card {
      background: rgba(10,10,20,0.88);
      border: 2px solid rgba(212,175,55,0.5);
      border-radius: 14px;
      padding: 18px 26px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }

    .rank-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ffd700, #a7822c 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid rgba(255,215,0,0.6);
      box-shadow: 0 0 16px rgba(255,215,0,0.4);
    }

    .rank-badge-stars {
      font-size: 9px;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }

    .rank-badge-label {
      font-size: 7px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      line-height: 1.2;
      margin-top: 2px;
    }

    .rank-info { flex: 1; }

    .rank-name {
      font-size: 1.1rem;
      color: #d4af37;
      font-weight: 700;
    }

    .rank-tier-label {
      font-size: 0.75rem;
      color: rgba(217,179,98,0.6);
      margin-top: 2px;
    }

    .rank-stars-bar {
      margin-top: 8px;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }

    .rank-stars-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #d4af37, #ffd700);
      transition: width 0.5s ease;
    }

    .rank-stars-text {
      font-size: 0.7rem;
      color: rgba(217,179,98,0.65);
      margin-top: 4px;
    }

    /* ── Combat Record Strip ────────────────────────────────── */
    .arena-record-strip {
      display: flex;
      width: 100%;
      max-width: 480px;
      margin: -10px 0 22px;
      background: rgba(8,8,16,0.85);
      border: 1px solid rgba(217,179,98,0.25);
      border-radius: 10px;
      overflow: hidden;
    }

    .arena-record-cell {
      flex: 1;
      padding: 10px 6px;
      text-align: center;
      border-right: 1px solid rgba(217,179,98,0.12);
    }

    .arena-record-cell:last-child { border-right: none; }

    .arena-record-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #d4af37;
      line-height: 1.1;
    }

    .arena-record-value.loss-value { color: rgba(238,230,209,0.75); }
    .arena-record-value.streak-hot { color: #ff9d45; text-shadow: 0 0 12px rgba(255,140,40,0.5); }

    .arena-record-label {
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(217,179,98,0.55);
      margin-top: 3px;
    }

    /* ── Battle History ─────────────────────────────────────── */
    .history-row-result {
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 0.72rem;
    }
    .history-row-result.win { color: #d4af37; }
    .history-row-result.loss { color: rgba(238,230,209,0.45); }
    .history-opponent-cell { color: #eee6d1; font-size: 0.78rem; }
    .history-opponent-epithet { color: rgba(217,179,98,0.55); font-size: 0.68rem; display: block; margin-top: 1px; }
    .history-stars-cell { font-size: 0.75rem; }
    .history-stars-cell.gain { color: #ffd700; }
    .history-stars-cell.drop { color: rgba(238,230,209,0.4); }
    .history-empty {
      text-align: center;
      color: rgba(217,179,98,0.45);
      font-size: 0.78rem;
      padding: 22px 10px;
      letter-spacing: 1px;
    }

    /* ── Action Buttons ─────────────────────────────────────── */
    .arena-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .arena-btn {
      font-family: "Cinzel", serif;
      font-size: clamp(10px, 1.3vw, 13px);
      font-weight: 600;
      letter-spacing: 1px;
      padding: clamp(10px,1.5vh,14px) clamp(18px,3vw,32px);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }

    .arena-btn-primary {
      background: url('assets/ui/generated/button_gold.webp') center / 100% 100% no-repeat;
      border: none;
      color: #14100a;
      text-shadow: 0 1px 0 rgba(255,235,170,0.5);
    }

    .arena-btn-primary:hover {
      filter: brightness(1.25);
      box-shadow: 0 0 24px rgba(212,175,55,0.6), 0 4px 14px rgba(0,0,0,0.6);
      transform: translateY(-2px);
    }

    .arena-btn-secondary {
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,0.14), transparent 65%),
        linear-gradient(180deg, rgba(28,26,36,0.95), rgba(12,12,20,0.95));
      border: 1.5px solid rgba(212,175,55,0.4);
      color: #d4af37;
      box-shadow: inset 0 1px 0 rgba(212,175,55,0.25), 0 4px 14px rgba(0,0,0,0.6);
    }

    .arena-btn-secondary:hover {
      border-color: rgba(212,175,55,0.8);
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,0.24), transparent 65%),
        linear-gradient(180deg, rgba(34,32,44,0.95), rgba(16,16,26,0.95));
      box-shadow: inset 0 1px 0 rgba(212,175,55,0.35), 0 0 18px rgba(212,175,55,0.35);
      transform: translateY(-2px);
    }

    .arena-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── Ranking Table ──────────────────────────────────────── */
    .ranking-section {
      width: 100%;
      max-width: 680px;
    }

    .ranking-section-title {
      font-size: 0.85rem;
      color: rgba(217,179,98,0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(8,8,16,0.85);
      border: 1px solid rgba(217,179,98,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .rank-table thead th {
      padding: 10px 14px;
      text-align: left;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: rgba(217,179,98,0.6);
      border-bottom: 1px solid rgba(217,179,98,0.15);
      background: rgba(217,179,98,0.05);
    }

    .rank-table tbody tr {
      border-bottom: 1px solid rgba(217,179,98,0.07);
      transition: background 0.15s;
    }

    .rank-table tbody tr:last-child { border-bottom: none; }
    .rank-table tbody tr:hover { background: rgba(217,179,98,0.06); }

    .rank-table tbody tr.current-rank {
      background: rgba(212,175,55,0.12);
      border-left: 3px solid #d4af37;
    }

    .rank-table tbody td {
      padding: 10px 14px;
      font-size: 0.8rem;
    }

    .rank-name-cell {
      color: #d4af37;
      font-weight: 600;
    }

    .rank-tier-cell {
      color: rgba(238,230,209,0.6);
      font-size: 0.72rem;
    }

    .rank-stars-cell {
      color: rgba(238,230,209,0.85);
      font-size: 0.75rem;
    }

    .rank-star-icon { width: 12px; height: 12px; vertical-align: middle; margin-right: 1px; }
    .rank-star-text { color: #ffd700; font-size: 0.75rem; }
    .rank-stars-imgs { display: flex; align-items: center; gap: 1px; }

    /* ── Back link ──────────────────────────────────────────── */
    .arena-back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      background: rgba(10,10,20,0.85);
      border: 2px solid rgba(212,175,55,0.5);
      border-radius: 8px;
      color: #d4af37;
      font-family: "Cinzel", serif;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .arena-back-btn:hover {
      background: rgba(212,175,55,0.15);
      border-color: rgba(212,175,55,0.9);
      box-shadow: 0 0 20px rgba(212,175,55,0.4);
    }

    @media (max-width: 500px) {
      .player-rank-card { padding: 14px 16px; }
      .rank-badge { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
  <div id="arena-bg"></div>

  <div class="arena-page">
    <h1 class="arena-title">ARENA</h1>
    <p class="arena-subtitle">Prove your worth as a shinobi</p>

    <!-- Player's current rank -->
    <div class="player-rank-card" id="player-rank-card">
      <div class="rank-badge" id="rank-badge">
        <div class="rank-badge-stars" id="rank-badge-stars">☆☆</div>
        <div class="rank-badge-label" id="rank-badge-label">Academy<br>Student</div>
      </div>
      <div class="rank-info">
        <div class="rank-name" id="rank-name-display">Academy Student</div>
        <div class="rank-tier-label" id="rank-tier-display">Tier 2 — 0 / 2 Stars</div>
        <div class="rank-stars-bar">
          <div class="rank-stars-fill" id="rank-stars-fill" style="width:0%"></div>
        </div>
        <div class="rank-stars-text" id="rank-stars-text">0 Arena Stars total</div>
      </div>
    </div>

    <!-- Combat record -->
    <div class="arena-record-strip" id="arena-record-strip">
      <div class="arena-record-cell">
        <div class="arena-record-value" id="record-wins">0</div>
        <div class="arena-record-label">Victories</div>
      </div>
      <div class="arena-record-cell">
        <div class="arena-record-value loss-value" id="record-losses">0</div>
        <div class="arena-record-label">Defeats</div>
      </div>
      <div class="arena-record-cell">
        <div class="arena-record-value" id="record-streak">0</div>
        <div class="arena-record-label">Win Streak</div>
      </div>
      <div class="arena-record-cell">
        <div class="arena-record-value" id="record-best">0</div>
        <div class="arena-record-label">Best Streak</div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="arena-actions">
      <button class="arena-btn arena-btn-primary" id="btn-battle-arena" onclick="openArenaBattle()">
        Battle
      </button>
      <button class="arena-btn arena-btn-secondary" onclick="openDefenseSetup()">
        Set Defense
      </button>
      <button class="arena-btn arena-btn-secondary" onclick="openSeasonRewards()">
        Rewards
      </button>
      <button class="arena-btn arena-btn-secondary" onclick="toggleRanksTable()">
        Ranks
      </button>
      <button class="arena-btn arena-btn-secondary" onclick="toggleHistoryTable()">
        Record
      </button>
    </div>

    <!-- Collapsible ranking table (hidden by default) -->
    <div class="ranking-section" id="ranking-section" style="display:none;">
      <div class="ranking-section-title">Rank Progression</div>
      <table class="rank-table" id="rank-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Tiers</th>
            <th>Stars Required</th>
          </tr>
        </thead>
        <tbody id="rank-table-body"></tbody>
      </table>
    </div>

    <!-- Collapsible battle history (hidden by default) -->
    <div class="ranking-section" id="history-section" style="display:none;">
      <div class="ranking-section-title">Recent Battles</div>
      <table class="rank-table" id="history-table">
        <thead>
          <tr>
            <th>Result</th>
            <th>Opponent</th>
            <th>Stars</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>

    <a href="village.html" class="arena-back-btn">← Return to Village</a>
  </div>

  <!-- Bottom navigation bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village">
        <img src="assets/icons/village_btm_btn.png" alt="Village">
      </button>
      <button class="hud-button" id="btn-characters" aria-label="Characters">
        <img src="assets/icons/characters_icon.png" alt="Characters" onerror="this.style.display='none'">
      </button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion">
        <img src="assets/icons/fusion_btm_btn.png" alt="Fusion">
      </button>
      <button class="hud-button" id="btn-teams" aria-label="Teams">
        <img src="assets/icons/teams_icon.png" alt="Teams">
      </button>
      <button class="hud-button" id="btn-tools" aria-label="Tools">
        <img src="assets/icons/guilds_icon.png" alt="Tools">
      </button>
      <button class="hud-button" id="btn-summon" aria-label="Summon">
        <img src="assets/icons/summon_btm_btn.png" alt="Summon">
      </button>
      <button class="hud-button" id="btn-missions" aria-label="Missions">
        <img src="assets/icons/mission_btm_btn.png" alt="Missions">
      </button>
      <button class="hud-button" id="btn-inventory" aria-label="Inventory">
        <img src="assets/icons/inventory_icon.png" alt="Inventory">
      </button>
      <button class="hud-button" id="btn-shop" aria-label="Shop">
        <img src="assets/icons/shop_btm_btn.png" alt="Shop">
      </button>
    </div>
  </div>

  <script src="js/resources.js"></script>
  <script>
  // ── Arena Rank Definitions ──────────────────────────────────────────────
  const ARENA_RANKS = [
    { name: 'Academy Student', tiers: 2, starsPerTier: 2 },
    { name: 'Genin',           tiers: 3, starsPerTier: 3 },
    { name: 'Chunin',          tiers: 3, starsPerTier: 4 },
    { name: 'Special Jounin',  tiers: 2, starsPerTier: 4 },
    { name: 'Jounin',          tiers: 2, starsPerTier: 5 },
    { name: 'Elite Jounin',    tiers: 2, starsPerTier: 5 },
    { name: 'ANBU',            tiers: 2, starsPerTier: 6 },
    { name: 'ANBU Captain',    tiers: 2, starsPerTier: 6 },
    { name: 'Shadow Kage',     tiers: 1, starsPerTier: 7  },
    { name: 'Sannin',          tiers: 1, starsPerTier: 8  },
    { name: 'Kage',            tiers: 1, starsPerTier: 10 },
    { name: 'Six Paths',       tiers: 1, starsPerTier: 12 },
    { name: 'Shinobi Legend',  tiers: 1, starsPerTier: 15 },
  ];

  function buildRankList() {
    const list = [];
    ARENA_RANKS.forEach(r => {
      for (let t = r.tiers; t >= 1; t--) {
        list.push({
          name: r.name,
          tier: r.tiers > 1 ? `T${t}` : 'T1',
          starsNeeded: r.starsPerTier,
          label: r.tiers > 1 ? `${r.name} T${t}` : r.name,
          totalStarsLabel: r.tiers > 1 ? `${r.starsPerTier} ★ per tier` : `${r.starsPerTier} ★`
        });
      }
    });
    return list;
  }

  function getArenaStars() {
    return Number(localStorage.getItem('arena_stars') || 0);
  }

  function getCurrentRankIndex(stars) {
    const list = buildRankList();
    let cumulative = 0;
    for (let i = 0; i < list.length; i++) {
      cumulative += list[i].starsNeeded;
      if (stars < cumulative) return { idx: i, starsInTier: stars - (cumulative - list[i].starsNeeded), rank: list[i] };
    }
    return { idx: list.length - 1, starsInTier: stars, rank: list[list.length - 1] };
  }

  function renderRankTable() {
    const tbody = document.getElementById('rank-table-body');
    if (!tbody) return;
    const stars = getArenaStars();
    const { idx } = getCurrentRankIndex(stars);
    const list = buildRankList();

    const starImg = '<img src="assets/ui/NormalStar.png" class="rank-star-icon" alt="*" onerror="this.style.display=\'none\'">';
    tbody.innerHTML = list.map((r, i) => `
      <tr class="${i === idx ? 'current-rank' : ''}">
        <td class="rank-name-cell">${r.label}</td>
        <td class="rank-tier-cell">${r.tier}</td>
        <td class="rank-stars-cell"><span class="rank-stars-imgs">${starImg} <span class="rank-star-text">${r.totalStarsLabel}</span></span></td>
      </tr>`).join('');
  }

  function renderPlayerRank() {
    const stars = getArenaStars();
    const { idx, starsInTier, rank } = getCurrentRankIndex(stars);

    document.getElementById('rank-name-display').textContent = rank.label;
    document.getElementById('rank-tier-display').textContent = `${rank.tier} — ${starsInTier} / ${rank.starsNeeded} ★`;
    document.getElementById('rank-badge-label').textContent = rank.name.replace(' ', '\n');
    const starHtml = '<img src="assets/ui/NormalStar.png" style="width:10px;height:10px;" onerror="this.style.display=\'none\'">';
    document.getElementById('rank-badge-stars').innerHTML = starHtml.repeat(Math.min(starsInTier, rank.starsNeeded)) || starHtml;
    document.getElementById('rank-stars-text').textContent = `${stars} Arena Stars total`;

    const pct = Math.min(100, Math.round((starsInTier / rank.starsNeeded) * 100));
    document.getElementById('rank-stars-fill').style.width = pct + '%';
    document.getElementById('rank-tier-display').textContent =
      `${rank.tier} — ${starsInTier} / ${rank.starsNeeded} Stars`;
  }

  function getArenaRecord() {
    try {
      const saved = JSON.parse(localStorage.getItem('arena_record_v1') || 'null');
      if (saved && typeof saved === 'object') {
        return { wins: 0, losses: 0, streak: 0, bestStreak: 0, ...saved };
      }
    } catch(e) {}
    return { wins: 0, losses: 0, streak: 0, bestStreak: 0 };
  }

  function renderRecordStrip() {
    const rec = getArenaRecord();
    document.getElementById('record-wins').textContent = rec.wins;
    document.getElementById('record-losses').textContent = rec.losses;
    const streakEl = document.getElementById('record-streak');
    streakEl.textContent = rec.streak;
    streakEl.classList.toggle('streak-hot', rec.streak >= 3);
    document.getElementById('record-best').textContent = rec.bestStreak;
  }

  function renderHistoryTable() {
    const tbody = document.getElementById('history-table-body');
    if (!tbody) return;
    let history = [];
    try { history = JSON.parse(localStorage.getItem('arena_history_v1') || '[]'); } catch(e) {}
    if (!Array.isArray(history) || history.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3"><div class="history-empty">No battles fought yet — step into the arena.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = history.map(h => {
      const win = h.result === 'win';
      const starsTxt = h.stars > 0 ? `+${h.stars} ★` : (h.stars < 0 ? `${h.stars} ★` : '—');
      return `<tr>
        <td><span class="history-row-result ${win ? 'win' : 'loss'}">${win ? 'VICTORY' : 'DEFEAT'}</span></td>
        <td class="history-opponent-cell">${h.opponent || 'Unknown Shinobi'}
          ${h.epithet ? `<span class="history-opponent-epithet">${h.epithet}</span>` : ''}</td>
        <td class="history-stars-cell ${h.stars > 0 ? 'gain' : 'drop'}">${starsTxt}${win && h.streak > 1 ? ` &nbsp;<span style="color:rgba(255,157,69,0.8);font-size:0.65rem">${h.streak} streak</span>` : ''}</td>
      </tr>`;
    }).join('');
  }

  function toggleHistoryTable() {
    const section = document.getElementById('history-section');
    if (!section) return;
    const isHidden = section.style.display === 'none';
    section.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      renderHistoryTable();
      document.getElementById('ranking-section').style.display = 'none';

  // ── Rival Shinobi Generation ─────────────────────────────────────────────
  const RIVAL_NAMES = [
    'Renga', 'Daichi', 'Suien', 'Arashi', 'Homura', 'Ibuki', 'Raiga',
    'Shizuku', 'Kagari', 'Setsuna', 'Sanshiro', 'Amane', 'Kohaku',
    'Yorito', 'Tsubaki', 'Hayase', 'Genzo', 'Mikazuki', 'Orin', 'Takumi'
  ];

  const RIVAL_EPITHETS = [
    'of the Crimson Gale', 'the Silent Blade', 'of the Burning Sand',
    'the Mist Phantom', 'of the Iron Cliff', 'the Storm Caller',
    'of the White Serpent', 'the Ember Fox', 'of the Broken Seal',
    'the Wandering Blade', 'of the Falling Leaves', 'the Thunder Fang',
    'of the Moonlit Marsh', 'the Stone Fist', 'of the Whispering Pines'
  ];

  const RIVAL_TIERS = [
    { label: 'Even Match', color: 'rgba(217,179,98,0.75)', bonusStars: 0, statScale: 0 },
    { label: 'Formidable', color: '#d4af37',               bonusStars: 1, statScale: 0.15 },
    { label: 'Elite',      color: '#ff9d45',               bonusStars: 2, statScale: 0.3 }

  let _arenaCharPool = null;

  async function loadArenaCharPool() {
    if (_arenaCharPool) return _arenaCharPool;
    let allChars = [];
    try {
      const r = await fetch('data/characters.json');
      const data = await r.json();
      allChars = Array.isArray(data) ? data : Object.values(data);
    } catch (e) {
      console.error('[Arena] Failed to load characters:', e);
    }
    // Playable units only — characters.json also holds props/items
    // (Deadly Beads, chests, boosts...) which have powerRank 0
    _arenaCharPool = allChars
      .filter(c => (Number(c.powerRank) || 0) > 0)
      .sort((a, b) => (a.powerRank || 0) - (b.powerRank || 0));
    return _arenaCharPool;
  }

  function buildRivalUnit(c, statMult) {
    const tierCode = c.starMaxCode || c.starMinCode || '3S';
    const portrait = (c.artByTier && c.artByTier[tierCode]?.portrait)
      || c.portrait || c.full || '';
    return {
      id: c.id,
      name: c.name,
      version: c.version || '',
      rarity: c.rarity || parseInt((c.starMinCode || '3').charAt(0)) || 3,
      icon: portrait,
      hp:  Math.round(((c.statsMax && c.statsMax.hp)  || 5000) * statMult),
      atk: Math.round(((c.statsMax && c.statsMax.atk) || 800)  * statMult),
      spd: (c.statsMax && (c.statsMax.speed || c.statsMax.spd)) || 100,
      skills: c.skills || {},
      element: c.element || null,
    };
  }

  function generateRivals(pool) {
    const stars = getArenaStars();
    const rankList = buildRankList();
    const { idx } = getCurrentRankIndex(stars);
    const progress = rankList.length > 1 ? idx / (rankList.length - 1) : 0;

    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    const usedNames = new Set();

    return RIVAL_TIERS.map((tier, d) => {
      // Units drawn from a power band that climbs with player rank + rival tier
      const center = Math.min(0.92, 0.12 + progress * 0.68 + d * 0.08);
      const lo = Math.max(0, Math.floor(pool.length * (center - 0.14)));
      const hi = Math.min(pool.length, Math.ceil(pool.length * (center + 0.14)));
      const band = pool.slice(lo, Math.max(hi, lo + 8));

      const statMult = 0.85 + progress * 0.55 + tier.statScale;
      const units = shuffle(band).slice(0, 4).map(c => buildRivalUnit(c, statMult));

      let name;
      do { name = RIVAL_NAMES[Math.floor(Math.random() * RIVAL_NAMES.length)]; }
      while (usedNames.has(name));
      usedNames.add(name);

      const epithet = RIVAL_EPITHETS[Math.floor(Math.random() * RIVAL_EPITHETS.length)];
      const rivalRank = rankList[Math.min(idx + d, rankList.length - 1)];
      const teamPower = units.reduce((s, u) => s + u.hp + u.atk * 5, 0);

      return { name, epithet, tier, rankLabel: rivalRank.label, units, teamPower };
    });
  }

  // ── Arena Team Picker ────────────────────────────────────────────────────
  async function openArenaTeamPicker(mode, enemyTeam = null) {
    // Load teams + inventory + characters
    let savedTeams = {};
    let inventory = {};
    let allChars = {};
    try { savedTeams = JSON.parse(localStorage.getItem('blazing_teams_v1') || '{}'); } catch(e) {}
    try {
      const invArr = JSON.parse(localStorage.getItem('blazing_inventory_v2') || '[]');
      if (Array.isArray(invArr)) invArr.forEach(inst => { inventory[inst.uid] = inst; });
    } catch(e) {}
    try {
      const r = await fetch('data/characters.json');
      const d = await r.json();
      allChars = Array.isArray(d) ? Object.fromEntries(d.map(c=>[c.id,c])) : d;
    } catch(e) {}

    const currentDefenseTeam = (() => {
      try { return JSON.parse(localStorage.getItem('arena_defense_team') || 'null'); } catch(e) { return null; }
    })();
    const currentOffenseTeam = (() => {
      try { return JSON.parse(localStorage.getItem('arena_offense_team') || 'null'); } catch(e) { return null; }
    })();

    // Build team cards HTML
    function buildTeamCard(teamNum) {
      const team = savedTeams[teamNum] || {};
      const slots = ['front-1','front-2','front-3','front-4','back-1','back-2','back-3','back-4','commander'];
      const members = slots.map(s => {
        const entry = team[s];
        if (!entry) return null;
        const inst = inventory[entry.uid] || { charId: entry.charId, level: 1, tierCode: null };
        const char = allChars[inst.charId || entry.charId] || null;
        if (!char) return null;
        const tierCode = inst.tierCode || char.starMaxCode || char.starMinCode || '3S';
        const portrait = (char.artByTier && char.artByTier[tierCode]?.portrait) || char.portrait || char.full || '';
        const jutsuName = char.skills?.jutsu?.name || 'Jutsu';
        const jutsuTier = char.skills?.jutsu?.byTier?.[tierCode] || Object.values(char.skills?.jutsu?.byTier || {})[0] || {};
        const chakra = jutsuTier.chakraCost || '—';
        const hp = char.statsMax?.hp || char.statsBase?.hp || 0;
        const atk = char.statsMax?.atk || char.statsBase?.atk || 0;
        return { portrait, name: char.name, version: char.version || '', jutsuName, chakra, hp, atk, rarity: char.rarity || 3 };
      }).filter(Boolean);

      if (members.length === 0) {
        return `<div class="atp-team-card empty" data-team="${teamNum}">
          <div class="atp-team-label">Team ${teamNum}</div>
          <div class="atp-empty-msg">No characters assigned</div>
        </div>`;
      }

      const rarityBorder = r => r >= 7 ? '#ff2244' : r >= 6 ? '#ffd700' : r >= 5 ? '#c084fc' : '#4ade80';
      const memberCards = members.map(m => `
        <div class="atp-member">
          <div class="atp-portrait" style="background-image:url('${m.portrait}');border-color:${rarityBorder(m.rarity)}"></div>
          <div class="atp-member-info">
            <div class="atp-member-name">${m.name}</div>
            ${m.version ? `<div class="atp-member-ver">${m.version}</div>` : ''}
            <div class="atp-jutsu-row">
              <div class="atp-jutsu-icon" style="background-image:url('${m.portrait}')"></div>
              <div class="atp-jutsu-name">${m.jutsuName}</div>
              <div class="atp-chakra">${m.chakra}C</div>
            </div>
          </div>
        </div>`).join('');

      const isActiveMode = mode === 'offense' ? currentOffenseTeam === teamNum : currentDefenseTeam === teamNum;
      return `<div class="atp-team-card ${isActiveMode ? 'atp-active' : ''}" data-team="${teamNum}" onclick="selectArenaTeam(${teamNum})">
        <div class="atp-team-label">Team ${teamNum}</div>
        <div class="atp-members">${memberCards}</div>
        ${isActiveMode ? '<div class="atp-active-badge">Current</div>' : ''}
      </div>`;
    }

    const title = mode === 'offense' ? 'Select Offense Team' : 'Select Defense Team';
    const desc  = mode === 'offense'
      ? 'Choose which team you will battle with in the Arena.'
      : 'Choose which team opponents will face when they challenge you.';

    document.getElementById('arena-team-picker')?.remove();
    const modal = document.createElement('div');
    // Build resolved player team data for all 3 teams (for use in VS modal)
    const resolvedTeams = {};
    for (let tn = 1; tn <= 8; tn++) {
      const team = savedTeams[tn] || {};
      const slots = ['front-1','front-2','front-3','front-4','back-1','back-2','back-3','back-4','commander'];
      resolvedTeams[tn] = slots.map(s => {
        const entry = team[s];
        if (!entry) return null;
        const inst = inventory[entry.uid] || { charId: entry.charId };
        const char = allChars[inst.charId || entry.charId] || null;
        if (!char) return null;
        const tierCode = inst.tierCode || char.starMaxCode || char.starMinCode || '3S';
        const portrait = (char.artByTier && char.artByTier[tierCode]?.portrait) || char.portrait || char.full || '';
        return { name: char.name, version: char.version || '', portrait, rarity: char.rarity || 3 };
      }).filter(Boolean);
    }

    modal.id = 'arena-team-picker';
    modal.dataset.mode = mode;
    modal.dataset.resolvedTeams = JSON.stringify(resolvedTeams);
    if (enemyTeam) modal.dataset.enemyTeam = JSON.stringify(enemyTeam);

    modal.innerHTML = `
      <div class="atp-overlay" onclick="document.getElementById('arena-team-picker').remove()"></div>
      <div class="atp-panel">
        <div class="atp-header">
          <div>
            <div class="atp-title">${title}</div>
            <div class="atp-desc">${desc}</div>
          </div>
          <button class="atp-close" onclick="document.getElementById('arena-team-picker').remove()">✕</button>
        </div>
        <div class="atp-teams">
          ${[1,2,3,4,5,6,7,8].map(n => buildTeamCard(n)).join('')}
        </div>
        <div class="atp-footer">
          <a href="teams.html" class="atp-link-btn">Manage Teams</a>
          <button class="atp-confirm" id="atp-confirm-btn" onclick="confirmArenaTeam()" disabled>
            ${mode === 'offense' ? 'Battle with this team' : 'Set as Defense Team'}
          </button>
        </div>
      </div>`;

    _injectArenaTeamPickerStyles();
    document.body.appendChild(modal);

    // Auto-select current team if set
    const currentNum = mode === 'offense' ? currentOffenseTeam : currentDefenseTeam;
    if (currentNum) {
      window._arenaPickerSelected = currentNum;
      document.getElementById('atp-confirm-btn').disabled = false;
    }
  }

  window._arenaPickerSelected = null;

  function selectArenaTeam(teamNum) {
    window._arenaPickerSelected = teamNum;
    document.querySelectorAll('.atp-team-card').forEach(c => {
      c.classList.toggle('atp-selected', parseInt(c.dataset.team) === teamNum);
    });
    const btn = document.getElementById('atp-confirm-btn');
    if (btn) btn.disabled = false;
  }

  async function confirmArenaTeam() {
    const modal = document.getElementById('arena-team-picker');
    if (!modal) return;
    const mode = modal.dataset.mode;
    const teamNum = window._arenaPickerSelected;
    if (!teamNum) return;

    if (mode === 'defense') {
      localStorage.setItem('arena_defense_team', JSON.stringify(teamNum));
      modal.remove();
      _showArenaInfoModal('Defense Team Set',
        `<p style="color:#6bcf7f;text-align:center;padding:16px 0;font-size:15px">Team ${teamNum} has been set as your Arena Defense Team.</p>`);
      return;
    }

    // Offense: store and proceed to VS modal
    localStorage.setItem('arena_offense_team', JSON.stringify(teamNum));

    let enemyTeam = [];
    let resolvedTeams = {};
    try { enemyTeam = JSON.parse(modal.dataset.enemyTeam || '[]'); } catch(e) {}
    try { resolvedTeams = JSON.parse(modal.dataset.resolvedTeams || '{}'); } catch(e) {}
    modal.remove();

    const playerMembers = resolvedTeams[teamNum] || [];
    showTeamSelectorModal(playerMembers, enemyTeam);
  }

  function startArenaBattle(enemyTeam, mapPath) {
    localStorage.setItem('arena_battle_mode', '1');

    localStorage.setItem('arena_map', mapPath);
    window.location.href = 'battle.html';

  function toggleRanksTable() {
    const section = document.getElementById('ranking-section');
    if (!section) return;
    const isHidden = section.style.display === 'none';
    section.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      const history = document.getElementById('history-section');
      if (history) history.style.display = 'none';
    }
  }

  // ── Season Rewards (claimable once per rank milestone) ──────────────────
  const SEASON_REWARD_MILESTONES = [
    { rank: 'Genin',          pearl: 10,  ryo: 5000,   shin: 2   },
    { rank: 'Chunin',         pearl: 20,  ryo: 10000,  shin: 5   },
    { rank: 'Jounin',         pearl: 50,  ryo: 25000,  shin: 10  },
    { rank: 'ANBU Captain',   pearl: 100, ryo: 50000,  shin: 20  },
    { rank: 'Kage',           pearl: 200, ryo: 100000, shin: 50  },
    { rank: 'Shinobi Legend', pearl: 500, ryo: 250000, shin: 100 },
  ];

  function getClaimedSeasonRewards() {
    try {
      const c = JSON.parse(localStorage.getItem('arena_rewards_claimed_v1') || '[]');
      return Array.isArray(c) ? c : [];
    } catch(e) { return []; }
  }

  function milestoneReached(rankName) {
    const list = buildRankList();
    const playerIdx = getCurrentRankIndex(getArenaStars()).idx;
    const milestoneIdx = list.findIndex(r => r.name === rankName);
    return milestoneIdx >= 0 && playerIdx >= milestoneIdx;
  }

  function claimSeasonReward(rankName) {
    const claimed = getClaimedSeasonRewards();
    if (claimed.includes(rankName) || !milestoneReached(rankName)) return;

    const reward = SEASON_REWARD_MILESTONES.find(m => m.rank === rankName);
    if (!reward || !window.Resources) return;

    window.Resources.add('ninja_pearls', reward.pearl);
    window.Resources.add('ryo', reward.ryo);
    window.Resources.add('shinobites', reward.shin);

    claimed.push(rankName);
    localStorage.setItem('arena_rewards_claimed_v1', JSON.stringify(claimed));

    // Re-render the modal with the updated claim state
    openSeasonRewards();
  }

  function openSeasonRewards() {
    const stars = getArenaStars();
    const { rank } = getCurrentRankIndex(stars);
    const claimed = getClaimedSeasonRewards();
    const pearlIcon = '<img src="assets/icons/currency/ninjapearl.png" style="width:14px;height:14px;vertical-align:middle;margin-right:3px;">';
    const ryoIcon   = '<img src="assets/icons/currency/ryo.png" style="width:14px;height:14px;vertical-align:middle;margin-right:3px;">';
    const shinIcon  = '<img src="assets/icons/currency/shinobite.png" style="width:14px;height:14px;vertical-align:middle;margin-right:3px;">';

    _showArenaInfoModal('Season Rewards',
      `<p style="color:#b8a080;line-height:1.6;margin-bottom:14px">Earn Arena Stars by winning battles. Each rank you reach unlocks spoils — claim them here.</p>
       <div style="display:flex;flex-direction:column;gap:8px">
         ${SEASON_REWARD_MILESTONES.map(r => {
           const isClaimed = claimed.includes(r.rank);
           const reached = milestoneReached(r.rank);
           let action;
           if (isClaimed) {
             action = '<span style="font-size:10px;font-weight:700;letter-spacing:1px;color:#6bcf7f;border:1px solid rgba(107,207,127,0.5);background:rgba(107,207,127,0.12);padding:4px 10px;border-radius:10px;text-transform:uppercase">Claimed</span>';
           } else if (reached) {
             action = `<button onclick="claimSeasonReward('${r.rank}')"
               style="font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:1px;padding:6px 16px;border-radius:8px;cursor:pointer;
                      background:linear-gradient(135deg,#a7822c,#d4af37);border:2px solid rgba(212,175,55,0.7);color:#0a0a0a;text-transform:uppercase">Claim</button>`;
           } else {
             action = '<span style="font-size:10px;letter-spacing:1.5px;color:rgba(238,230,209,0.3);text-transform:uppercase">Locked</span>';
           }
           return `
           <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
                       background:${reached && !isClaimed ? 'rgba(212,175,55,0.08)' : 'rgba(20,20,35,0.6)'};
                       border:1px solid ${reached && !isClaimed ? 'rgba(212,175,55,0.45)' : 'rgba(184,152,95,0.2)'};
                       ${!reached ? 'opacity:0.55;' : ''}">
             <span style="color:#d4af37;font-weight:600;font-size:13px;flex-shrink:0">${r.rank}</span>
             <span style="color:#e0e0e0;font-size:12px;display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end">
               <span>${pearlIcon}${r.pearl}</span>
               <span>${ryoIcon}${r.ryo.toLocaleString()}</span>
               <span>${shinIcon}${r.shin}</span>
             </span>
             ${action}
           </div>`;
         }).join('')}
       </div>
       <p style="color:#d4af37;margin-top:14px;font-size:12px">Current Rank: <strong>${rank.label}</strong> &mdash; ${stars} Stars</p>`
    );
  }
