<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blazing — Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script src="js/device-detect.js"></script>
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Blazing" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="assets/icons/achievement_icon.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/bottombar.css" />
  <link rel="stylesheet" href="css/arena.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div id="arena-bg"></div>

  <div class="arena-page">
    <header class="arena-topbar">
      <a href="village.html" class="arena-back" aria-label="Back to village">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 class="arena-title">Arena</h1>
      <div class="arena-stars-chip" title="Arena Stars">
        <img src="assets/ui/star_icon.png" alt="">
        <span id="arena-stars-total">0</span>
      </div>
    </header>

    <main class="arena-main">
      <!-- Rank panel -->
      <section class="rank-panel" id="player-rank-card">
        <div class="rank-hero">
          <div class="rank-badge" id="rank-badge">
            <div class="rank-badge-tier" id="rank-badge-tier">T2</div>
          </div>
          <div class="rank-info">
            <div class="rank-name" id="rank-name-display">Academy Student</div>
            <div class="rank-progress-row">
              <div class="rank-stars-text" id="rank-stars-text">Next: Academy Student T1</div>
              <div class="rank-tier-label" id="rank-tier-display">0 / 2</div>
            </div>
            <div class="rank-stars-bar">
              <div class="rank-stars-fill" id="rank-stars-fill" style="width:0%"></div>
            </div>
          </div>
        </div>

        <div class="arena-record-strip" id="arena-record-strip">
          <div class="arena-record-cell">
            <div class="arena-record-value" id="record-wins">0</div>
            <div class="arena-record-label">Wins</div>
          </div>
          <div class="arena-record-cell">
            <div class="arena-record-value loss-value" id="record-losses">0</div>
            <div class="arena-record-label">Losses</div>
          </div>
          <div class="arena-record-cell">
            <div class="arena-record-value" id="record-streak">0</div>
            <div class="arena-record-label">Streak</div>
          </div>
          <div class="arena-record-cell">
            <div class="arena-record-value" id="record-best">0</div>
            <div class="arena-record-label">Best</div>
          </div>
        </div>
      </section>

      <!-- Actions -->
      <section class="arena-actions">
        <button class="arena-battle-btn" id="btn-battle-arena" onclick="openArenaBattle()">Battle</button>

        <div class="arena-tiles">
          <button class="arena-tile" id="tile-defense" onclick="openDefenseSetup()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.8l7.5 3v5.6c0 4.7-3.2 8.5-7.5 9.9-4.3-1.4-7.5-5.2-7.5-9.9V5.8z" fill="currentColor" fill-opacity=".18"/><path d="M12 7v10"/></svg>
            <span class="arena-tile-label">Defense</span>
            <span class="arena-tile-sub" id="defense-team-sub">Not set</span>
          </button>
          <button class="arena-tile" id="tile-rewards" onclick="openSeasonRewards()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3.5 10.5h17v8.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" fill="currentColor" fill-opacity=".18"/><path d="M3.5 10.5V8a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4v2.5"/><path d="M10 10.5v3h4v-3"/></svg>
            <span class="arena-tile-label">Rewards</span>
            <span class="arena-tile-sub" id="rewards-sub">Season</span>
            <span class="arena-tile-badge" id="rewards-badge" hidden>0</span>
          </button>
          <button class="arena-tile" id="tile-ranks" onclick="toggleRanksTable()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6h4v6M10 20V9h4v11M15 20v-8h4v8" fill="currentColor" fill-opacity=".18"/><path d="M3 20h18"/></svg>
            <span class="arena-tile-label">Ranks</span>
            <span class="arena-tile-sub">Ladder</span>
          </button>
          <button class="arena-tile" id="tile-record" onclick="toggleHistoryTable()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="2" fill="currentColor" fill-opacity=".18"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
            <span class="arena-tile-label">Record</span>
            <span class="arena-tile-sub">History</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Collapsible ranking table (hidden by default) -->
    <div class="ranking-section" id="ranking-section" style="display:none;">
      <div class="ranking-section-title">Rank Ladder</div>
      <table class="rank-table" id="rank-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Tier</th>
            <th>Stars Needed</th>
          </tr>
        </thead>
        <tbody id="rank-table-body"></tbody>
      </table>
    </div>

    <!-- Collapsible battle history (hidden by default) -->
    <div class="ranking-section" id="history-section" style="display:none;">
      <div class="ranking-section-title">Recent Battles</div>
      <table class="rank-table" id="history-table">
        <thead>
          <tr>
            <th>Result</th>
            <th>Opponent</th>
            <th>Stars</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Bottom navigation bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village">
        <img src="assets/icons/nav/village_btm_btn.png" alt="Village">
      </button>
      <button class="hud-button" id="btn-characters" aria-label="Shinobi">
        <img src="assets/icons/nav/characters_icon.png" alt="Characters" onerror="this.style.display='none'">
      </button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion">
        <img src="assets/icons/nav/fusion_btm_btn.png" alt="Fusion">
      </button>
      <button class="hud-button" id="btn-teams" aria-label="Teams">
        <img src="assets/icons/nav/teams_icon.png" alt="Teams">
      </button>
      <button class="hud-button" id="btn-tools" aria-label="Tools">
        <img src="assets/icons/nav/guilds_icon.png" alt="Tools">
      </button>
      <button class="hud-button" id="btn-summon" aria-label="Summon">
        <img src="assets/icons/nav/summon_btm_btn.png" alt="Summon">
      </button>
      <button class="hud-button" id="btn-missions" aria-label="Missions">
        <img src="assets/icons/nav/mission_btm_btn.png" alt="Missions">
      </button>
      <button class="hud-button" id="btn-inventory" aria-label="Items">
        <img src="assets/icons/nav/inventory_icon.png" alt="Inventory">
      </button>
      <button class="hud-button" id="btn-shop" aria-label="Shop">
        <img src="assets/icons/nav/shop_btm_btn.png" alt="Shop">
      </button>
    </div>
  </div>

  <script src="js/resources.js"></script>
  <script>
  // ── Star icon helper — renders the game's star asset in place of glyphs ──
  const STAR_ASSET = 'assets/ui/star_icon.png';
  function starIco(px = 12) {
    return `<img src="${STAR_ASSET}" class="star-ico" style="width:${px}px;height:${px}px" alt="star" onerror="this.style.display='none'">`;
  }

  // ── Arena Rank Definitions ──────────────────────────────────────────────
  const ARENA_RANKS = [
    { name: 'Academy Student', tiers: 2, starsPerTier: 2 },
    { name: 'Genin',           tiers: 3, starsPerTier: 3 },
    { name: 'Chunin',          tiers: 3, starsPerTier: 4 },
    { name: 'Special Jounin',  tiers: 2, starsPerTier: 4 },
    { name: 'Jounin',          tiers: 2, starsPerTier: 5 },
    { name: 'Elite Jounin',    tiers: 2, starsPerTier: 5 },
    { name: 'ANBU',            tiers: 2, starsPerTier: 6 },
    { name: 'ANBU Captain',    tiers: 2, starsPerTier: 6 },
    { name: 'Shadow Kage',     tiers: 1, starsPerTier: 7  },
    { name: 'Sannin',          tiers: 1, starsPerTier: 8  },
    { name: 'Kage',            tiers: 1, starsPerTier: 10 },
    { name: 'Six Paths',       tiers: 1, starsPerTier: 12 },
    { name: 'Shinobi Legend',  tiers: 1, starsPerTier: 15 },
  ];

  function buildRankList() {
    const list = [];
    ARENA_RANKS.forEach(r => {
      for (let t = r.tiers; t >= 1; t--) {
        list.push({
          name: r.name,
          tier: r.tiers > 1 ? `T${t}` : 'T1',
          starsNeeded: r.starsPerTier,
          label: r.tiers > 1 ? `${r.name} T${t}` : r.name,
          totalStarsLabel: r.tiers > 1 ? `${r.starsPerTier} per tier` : `${r.starsPerTier}`
        });
      }
    });
    return list;
  }

  function getArenaStars() {
    return Number(localStorage.getItem('arena_stars') || 0);
  }

  function getCurrentRankIndex(stars) {
    const list = buildRankList();
    let cumulative = 0;
    for (let i = 0; i < list.length; i++) {
      cumulative += list[i].starsNeeded;
      if (stars < cumulative) return { idx: i, starsInTier: stars - (cumulative - list[i].starsNeeded), rank: list[i] };
    }
    return { idx: list.length - 1, starsInTier: stars, rank: list[list.length - 1] };
  }

  function renderRankTable() {
    const tbody = document.getElementById('rank-table-body');
    if (!tbody) return;
    const stars = getArenaStars();
    const { idx } = getCurrentRankIndex(stars);
    const list = buildRankList();

    tbody.innerHTML = list.map((r, i) => `
      <tr class="${i === idx ? 'current-rank' : ''}">
        <td class="rank-name-cell">${r.label}</td>
        <td class="rank-tier-cell">${r.tier}</td>
        <td class="rank-stars-cell"><span class="rank-stars-imgs"><span class="rank-star-text">${r.totalStarsLabel}</span> ${starIco(13)}</span></td>
      </tr>`).join('');
  }

  function renderPlayerRank() {
    const stars = getArenaStars();
    const { idx, starsInTier, rank } = getCurrentRankIndex(stars);

    document.getElementById('rank-name-display').textContent = rank.name;
    document.getElementById('rank-badge-tier').textContent = rank.tier;
    const totalEl = document.getElementById('arena-stars-total');
    if (totalEl) totalEl.textContent = stars;

    const list = buildRankList();
    const next = list[idx + 1];
    document.getElementById('rank-stars-text').textContent = next ? `Next: ${next.label}` : 'Top rank reached';

    const pct = Math.min(100, Math.round((starsInTier / rank.starsNeeded) * 100));
    document.getElementById('rank-stars-fill').style.width = pct + '%';
    document.getElementById('rank-tier-display').innerHTML =
      `${starsInTier} / ${rank.starsNeeded} ${starIco(16)}`;
  }

  // Tile sub-labels: current defense team + claimable reward count
  function renderActionTiles() {
    let def = null;
    try { def = JSON.parse(localStorage.getItem('arena_defense_team') || 'null'); } catch(e) {}
    const defSub = document.getElementById('defense-team-sub');
    if (defSub) defSub.textContent = def ? `Team ${def}` : 'Not set';

    const claimed = getClaimedSeasonRewards();
    const ready = SEASON_REWARD_MILESTONES.filter(m => !claimed.includes(m.rank) && milestoneReached(m.rank)).length;
    const badge = document.getElementById('rewards-badge');
    if (badge) { badge.textContent = ready; badge.hidden = ready === 0; }
    const rSub = document.getElementById('rewards-sub');
    if (rSub) rSub.textContent = ready ? 'Ready!' : 'Season';
  }

  function getArenaRecord() {
    try {
      const saved = JSON.parse(localStorage.getItem('arena_record_v1') || 'null');
      if (saved && typeof saved === 'object') {
        return { wins: 0, losses: 0, streak: 0, bestStreak: 0, ...saved };
      }
    } catch(e) {}
    return { wins: 0, losses: 0, streak: 0, bestStreak: 0 };
  }

  function renderRecordStrip() {
    const rec = getArenaRecord();
    document.getElementById('record-wins').textContent = rec.wins;
    document.getElementById('record-losses').textContent = rec.losses;
    const streakEl = document.getElementById('record-streak');
    streakEl.textContent = rec.streak;
    streakEl.classList.toggle('streak-hot', rec.streak >= 3);
    document.getElementById('record-best').textContent = rec.bestStreak;
  }

  function renderHistoryTable() {
    const tbody = document.getElementById('history-table-body');
    if (!tbody) return;
    let history = [];
    try { history = JSON.parse(localStorage.getItem('arena_history_v1') || '[]'); } catch(e) {}
    if (!Array.isArray(history) || history.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3"><div class="history-empty">No battles yet.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = history.map(h => {
      const win = h.result === 'win';
      const starsTxt = h.stars > 0 ? `+${h.stars} ${starIco(11)}` : (h.stars < 0 ? `${h.stars} ${starIco(11)}` : '—');
      return `<tr>
        <td><span class="history-row-result ${win ? 'win' : 'loss'}">${win ? 'VICTORY' : 'DEFEAT'}</span></td>
        <td class="history-opponent-cell">${h.opponent || 'Unknown Shinobi'}
          ${h.epithet ? `<span class="history-opponent-epithet">${h.epithet}</span>` : ''}</td>
        <td class="history-stars-cell ${h.stars > 0 ? 'gain' : 'drop'}">${starsTxt}${win && h.streak > 1 ? `<span class="history-streak">${h.streak} streak</span>` : ''}</td>
      </tr>`;
    }).join('');
  }

  function toggleHistoryTable() {
    const section = document.getElementById('history-section');
    if (!section) return;
    const isHidden = section.style.display === 'none';
    section.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      renderHistoryTable();
      document.getElementById('ranking-section').style.display = 'none';
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    _syncDrawerTiles();
  }

  function _syncDrawerTiles() {
    const open = id => document.getElementById(id)?.style.display !== 'none';
    document.getElementById('tile-ranks')?.classList.toggle('is-open', open('ranking-section'));
    document.getElementById('tile-record')?.classList.toggle('is-open', open('history-section'));
  }

  // ── Rank-up celebration (fires when returning above last seen rank) ─────
  function checkRankUpCelebration() {
    const stars = getArenaStars();
    const { idx, rank } = getCurrentRankIndex(stars);
    const lastSeen = Number(localStorage.getItem('arena_last_rank_idx'));
    localStorage.setItem('arena_last_rank_idx', String(idx));

    if (!Number.isFinite(lastSeen) || idx <= lastSeen) return;

    _showArenaInfoModal('Rank Up!',
      `<div class="rankup">
        <img src="assets/ui/arena_rank_emblem.png" alt="">
        <div class="rankup-name">${rank.label}</div>
        <div class="rankup-sub">${stars} Arena Stars · new rewards may be ready</div>
      </div>`);
  }

  renderRankTable();
  renderPlayerRank();
  renderRecordStrip();
  renderHistoryTable();
  checkRankUpCelebration();
  // Deferred: reward milestones are declared further down the script
  setTimeout(renderActionTiles, 0);

  // ── Arena Battle Maps ────────────────────────────────────────────────────
  const ARENA_MAPS = [
    'bg_020101_mori','bg_030101_kaido','bg_040101_heigen','bg_050101_iwaba',
    'bg_060101_kouya','bg_070101_kawara','bg_080101_sabaibaru','bg_090101_oohashi',
    'bg_100101_shinomori','bg_110101_yosen','bg_120101_honsen','bg_130101_tanzaku',
    'bg_140101_syumatu','bg_150101_suna','bg_160101_akatuki','bg_170101_tenti',
    'bg_180101_oroti','bg_190101_hinotera','bg_200101_kankin','bg_220101_konoha_houkai',
    'bg_230101_utiha','bg_240101_tetu','bg_250101_samurai','bg_260101_unrai',
    'bg_270101_kitaajito','bg_280101_doukutu','bg_290101_kaigan','bg_300101_sabaku',
    'bg_310101_shinjyu','bg_330101_konohasato','bg_340101_kihinseki','bg_350101_kinoko',
    'bg_360101_takenoko','bg_370101_senjyou','bg_400101_ame_soto','bg_420101_utiha2',
    'bg_440101_shinjitu','bg_450101_kukan','bg_460101_yougan','bg_470101_hyouzan',
    'bg_490101_tyojuryoku','bg_500101_fusyujyou','bg_510101_shinratensei',
    'bg_520101_ninkaibuto','bg_530101_jigokudani','bg_540101_rpg','bg_580101_syuumatunotani',
    'bg_590101_hondou','bg_600101_isidan'
  ];

  function randomMap() {
    return 'assets/maps/' + ARENA_MAPS[Math.floor(Math.random() * ARENA_MAPS.length)] + '.png';
  }

  // ── Rival Shinobi Generation ─────────────────────────────────────────────
  const RIVAL_NAMES = [
    'Renga', 'Daichi', 'Suien', 'Arashi', 'Homura', 'Ibuki', 'Raiga',
    'Shizuku', 'Kagari', 'Setsuna', 'Sanshiro', 'Amane', 'Kohaku',
    'Yorito', 'Tsubaki', 'Hayase', 'Genzo', 'Mikazuki', 'Orin', 'Takumi'
  ];

  const RIVAL_EPITHETS = [
    'of the Crimson Gale', 'the Silent Blade', 'of the Burning Sand',
    'the Mist Phantom', 'of the Iron Cliff', 'the Storm Caller',
    'of the White Serpent', 'the Ember Fox', 'of the Broken Seal',
    'the Wandering Blade', 'of the Falling Leaves', 'the Thunder Fang',
    'of the Moonlit Marsh', 'the Stone Fist', 'of the Whispering Pines'
  ];

  const RIVAL_TIERS = [
    { label: 'Even Match', color: '#8fd18a', bonusStars: 0, statScale: 0 },
    { label: 'Formidable', color: '#f6cf6a',               bonusStars: 1, statScale: 0.15 },
    { label: 'Elite',      color: '#ff7a4a',               bonusStars: 2, statScale: 0.3 }
  ];

  let _arenaCharPool = null;

  async function loadArenaCharPool() {
    if (_arenaCharPool) return _arenaCharPool;
    let allChars = [];
    try {
      const r = await fetch('data/characters.json');
      const data = await r.json();
      allChars = Array.isArray(data) ? data : Object.values(data);
    } catch (e) {
      console.error('[Arena] Failed to load characters:', e);
    }
    // Playable units only — characters.json also holds props/items
    // (Deadly Beads, chests, boosts...) which have powerRank 0
    _arenaCharPool = allChars
      .filter(c => (Number(c.powerRank) || 0) > 0)
      .sort((a, b) => (a.powerRank || 0) - (b.powerRank || 0));
    return _arenaCharPool;
  }

  function buildRivalUnit(c, statMult) {
    const tierCode = c.starMaxCode || c.starMinCode || '3S';
    const portrait = (c.artByTier && c.artByTier[tierCode]?.portrait)
      || c.portrait || c.full || '';
    return {
      id: c.id,
      name: c.name,
      version: c.version || '',
      rarity: c.rarity || parseInt((c.starMinCode || '3').charAt(0)) || 3,
      icon: portrait,
      hp:  Math.round(((c.statsMax && c.statsMax.hp)  || 5000) * statMult),
      atk: Math.round(((c.statsMax && c.statsMax.atk) || 800)  * statMult),
      spd: (c.statsMax && (c.statsMax.speed || c.statsMax.spd)) || 100,
      skills: c.skills || {},
      element: c.element || null,
    };
  }

  function generateRivals(pool) {
    const stars = getArenaStars();
    const rankList = buildRankList();
    const { idx } = getCurrentRankIndex(stars);
    const progress = rankList.length > 1 ? idx / (rankList.length - 1) : 0;

    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    const usedNames = new Set();

    return RIVAL_TIERS.map((tier, d) => {
      // Units drawn from a power band that climbs with player rank + rival tier
      const center = Math.min(0.92, 0.12 + progress * 0.68 + d * 0.08);
      const lo = Math.max(0, Math.floor(pool.length * (center - 0.14)));
      const hi = Math.min(pool.length, Math.ceil(pool.length * (center + 0.14)));
      const band = pool.slice(lo, Math.max(hi, lo + 8));

      const statMult = 0.85 + progress * 0.55 + tier.statScale;
      const units = shuffle(band).slice(0, 4).map(c => buildRivalUnit(c, statMult));

      let name;
      do { name = RIVAL_NAMES[Math.floor(Math.random() * RIVAL_NAMES.length)]; }
      while (usedNames.has(name));
      usedNames.add(name);

      const epithet = RIVAL_EPITHETS[Math.floor(Math.random() * RIVAL_EPITHETS.length)];
      const rivalRank = rankList[Math.min(idx + d, rankList.length - 1)];
      const teamPower = units.reduce((s, u) => s + u.hp + u.atk * 5, 0);

      return { name, epithet, tier, rankLabel: rivalRank.label, units, teamPower };
    });
  }

  // ── Arena Battle Flow ────────────────────────────────────────────────────
  async function openArenaBattle() {
    const pool = await loadArenaCharPool();
    if (!pool || pool.length === 0) {
      _showArenaInfoModal('Can\'t Load Opponents',
        '<p class="aim-note">Could not load opponent data. Try again shortly.</p>');
      return;
    }
    showOpponentSelect(generateRivals(pool));
  }

  function showOpponentSelect(rivals) {
    document.getElementById('arena-opponent-select')?.remove();

    const cardsHTML = rivals.map((r, i) => {
      const portraits = r.units.map(u => `
        <div class="aos-unit">
          <img src="${u.icon || 'assets/characters/common/silhouette.png'}" alt=""
               onerror="this.src='assets/characters/common/silhouette.png'">
        </div>`).join('');
      const bounty = 1 + r.tier.bonusStars;
      return `
      <div class="aos-card" onclick="chooseOpponent(${i})">
        <div class="aos-emblem">
          <div class="aos-emblem-inner">${r.name.charAt(0)}</div>
        </div>
        <div class="aos-info">
          <div class="aos-name">${r.name} <span class="aos-epithet">${r.epithet}</span></div>
          <div class="aos-rank">${r.rankLabel}</div>
          <div class="aos-units">${portraits}</div>
        </div>
        <div class="aos-side">
          <div class="aos-threat" style="color:${r.tier.color}">${r.tier.label}</div>
          <div class="aos-power">PWR ${Math.round(r.teamPower / 1000)}k</div>
          <div class="aos-bounty">${starIco(15).repeat(bounty)}<span class="aos-bounty-label">reward</span></div>
        </div>
      </div>`;
    }).join('');

    const modal = document.createElement('div');
    modal.id = 'arena-opponent-select';
    modal._rivals = rivals;
    modal.innerHTML = `
      <div class="aos-overlay" onclick="document.getElementById('arena-opponent-select').remove()"></div>
      <div class="aos-panel">
        <div class="aos-header">
          <div>
            <div class="aos-title">Choose Opponent</div>
            <div class="aos-desc">Three rivals near your rank</div>
          </div>
          <button class="aos-close" onclick="document.getElementById('arena-opponent-select').remove()">✕</button>
        </div>
        <div class="aos-cards">${cardsHTML}</div>
        <div class="aos-footer">
          <button class="aos-rescout" onclick="rescoutOpponents()">Scout Again</button>
          <div class="aos-hint">Tougher rivals = more stars</div>
        </div>
      </div>`;

    _injectOpponentSelectStyles();
    document.body.appendChild(modal);
  }

  async function rescoutOpponents() {
    const pool = await loadArenaCharPool();
    if (!pool || pool.length === 0) return;
    showOpponentSelect(generateRivals(pool));
  }

  function chooseOpponent(index) {
    const modal = document.getElementById('arena-opponent-select');
    if (!modal || !modal._rivals) return;
    const rival = modal._rivals[index];
    if (!rival) return;
    modal.remove();

    // Battle result screen attributes the outcome to this rival
    localStorage.setItem('arena_opponent', JSON.stringify({
      name: rival.name,
      epithet: rival.epithet,
      bonusStars: rival.tier.bonusStars
    }));

    openArenaTeamPicker('offense', rival.units);
  }

  // Modal styles live in css/arena.css
  function _injectOpponentSelectStyles() {}

  // ── Arena Team Picker ────────────────────────────────────────────────────
  async function openArenaTeamPicker(mode, enemyTeam = null) {
    // Load teams + inventory + characters
    let savedTeams = {};
    let inventory = {};
    let allChars = {};
    try { savedTeams = JSON.parse(localStorage.getItem('blazing_teams_v1') || '{}'); } catch(e) {}
    try {
      const invArr = JSON.parse(localStorage.getItem('blazing_inventory_v2') || '[]');
      if (Array.isArray(invArr)) invArr.forEach(inst => { inventory[inst.uid] = inst; });
    } catch(e) {}
    try {
      const r = await fetch('data/characters.json');
      const d = await r.json();
      allChars = Array.isArray(d) ? Object.fromEntries(d.map(c=>[c.id,c])) : d;
    } catch(e) {}

    const currentDefenseTeam = (() => {
      try { return JSON.parse(localStorage.getItem('arena_defense_team') || 'null'); } catch(e) { return null; }
    })();
    const currentOffenseTeam = (() => {
      try { return JSON.parse(localStorage.getItem('arena_offense_team') || 'null'); } catch(e) { return null; }
    })();

    // Build team cards HTML
    function buildTeamCard(teamNum) {
      const team = savedTeams[teamNum] || {};
      const slots = ['front-1','front-2','front-3','front-4','back-1','back-2','back-3','back-4','commander'];
      const members = slots.map(s => {
        const entry = team[s];
        if (!entry) return null;
        const inst = inventory[entry.uid] || { charId: entry.charId, level: 1, tierCode: null };
        const char = allChars[inst.charId || entry.charId] || null;
        if (!char) return null;
        const tierCode = inst.tierCode || char.starMaxCode || char.starMinCode || '3S';
        const portrait = (char.artByTier && char.artByTier[tierCode]?.portrait) || char.portrait || char.full || '';
        const jutsuName = char.skills?.jutsu?.name || 'Jutsu';
        const jutsuTier = char.skills?.jutsu?.byTier?.[tierCode] || Object.values(char.skills?.jutsu?.byTier || {})[0] || {};
        const chakra = jutsuTier.chakraCost || '—';
        const hp = char.statsMax?.hp || char.statsBase?.hp || 0;
        const atk = char.statsMax?.atk || char.statsBase?.atk || 0;
        return { portrait, name: char.name, version: char.version || '', jutsuName, chakra, hp, atk, rarity: char.rarity || 3 };
      }).filter(Boolean);

      if (members.length === 0) {
        return `<div class="atp-team-card empty" data-team="${teamNum}">
          <div class="atp-team-label">Team ${teamNum}</div>
          <div class="atp-empty-msg">No characters assigned</div>
        </div>`;
      }

      const rarityBorder = r => r >= 7 ? '#ff2244' : r >= 6 ? '#ffd700' : r >= 5 ? '#c084fc' : '#4ade80';
      const memberCards = members.map(m => `
        <div class="atp-member">
          <div class="atp-portrait" style="background-image:url('${m.portrait}');border-color:${rarityBorder(m.rarity)}"></div>
          <div class="atp-member-info">
            <div class="atp-member-name">${m.name}</div>
            ${m.version ? `<div class="atp-member-ver">${m.version}</div>` : ''}
            <div class="atp-jutsu-row">
              <div class="atp-jutsu-icon" style="background-image:url('${m.portrait}')"></div>
              <div class="atp-jutsu-name">${m.jutsuName}</div>
              <div class="atp-chakra">${m.chakra}C</div>
            </div>
          </div>
        </div>`).join('');

      const isActiveMode = mode === 'offense' ? currentOffenseTeam === teamNum : currentDefenseTeam === teamNum;
      return `<div class="atp-team-card ${isActiveMode ? 'atp-active' : ''}" data-team="${teamNum}" onclick="selectArenaTeam(${teamNum})">
        <div class="atp-team-label">Team ${teamNum}</div>
        <div class="atp-members">${memberCards}</div>
        ${isActiveMode ? '<div class="atp-active-badge">Current</div>' : ''}
      </div>`;
    }

    const title = mode === 'offense' ? 'Select Offense Team' : 'Select Defense Team';
    const desc  = mode === 'offense'
      ? 'Pick the team you will fight with.'
      : 'Pick the team other players will fight against.';

    document.getElementById('arena-team-picker')?.remove();
    const modal = document.createElement('div');
    // Build resolved player team data for all 3 teams (for use in VS modal)
    const resolvedTeams = {};
    for (let tn = 1; tn <= 8; tn++) {
      const team = savedTeams[tn] || {};
      const slots = ['front-1','front-2','front-3','front-4','back-1','back-2','back-3','back-4','commander'];
      resolvedTeams[tn] = slots.map(s => {
        const entry = team[s];
        if (!entry) return null;
        const inst = inventory[entry.uid] || { charId: entry.charId };
        const char = allChars[inst.charId || entry.charId] || null;
        if (!char) return null;
        const tierCode = inst.tierCode || char.starMaxCode || char.starMinCode || '3S';
        const portrait = (char.artByTier && char.artByTier[tierCode]?.portrait) || char.portrait || char.full || '';
        return { name: char.name, version: char.version || '', portrait, rarity: char.rarity || 3 };
      }).filter(Boolean);
    }

    modal.id = 'arena-team-picker';
    modal.dataset.mode = mode;
    modal.dataset.resolvedTeams = JSON.stringify(resolvedTeams);
    if (enemyTeam) modal.dataset.enemyTeam = JSON.stringify(enemyTeam);

    modal.innerHTML = `
      <div class="atp-overlay" onclick="document.getElementById('arena-team-picker').remove()"></div>
      <div class="atp-panel">
        <div class="atp-header">
          <div>
            <div class="atp-title">${title}</div>
            <div class="atp-desc">${desc}</div>
          </div>
          <button class="atp-close" onclick="document.getElementById('arena-team-picker').remove()">✕</button>
        </div>
        <div class="atp-teams">
          ${[1,2,3,4,5,6,7,8].map(n => buildTeamCard(n)).join('')}
        </div>
        <div class="atp-footer">
          <a href="teams.html" class="atp-link-btn">Manage Teams</a>
          <button class="atp-confirm arena-pill-btn${mode === 'offense' ? '' : ' blue'}" id="atp-confirm-btn" onclick="confirmArenaTeam()" disabled>
            ${mode === 'offense' ? 'Use This Team' : 'Set Defense'}
          </button>
        </div>
      </div>`;

    _injectArenaTeamPickerStyles();
    document.body.appendChild(modal);

    // Auto-select current team if set
    const currentNum = mode === 'offense' ? currentOffenseTeam : currentDefenseTeam;
    if (currentNum) {
      window._arenaPickerSelected = currentNum;
      document.getElementById('atp-confirm-btn').disabled = false;
    }
  }

  window._arenaPickerSelected = null;

  function selectArenaTeam(teamNum) {
    window._arenaPickerSelected = teamNum;
    document.querySelectorAll('.atp-team-card').forEach(c => {
      c.classList.toggle('atp-selected', parseInt(c.dataset.team) === teamNum);
    });
    const btn = document.getElementById('atp-confirm-btn');
    if (btn) btn.disabled = false;
  }

  async function confirmArenaTeam() {
    const modal = document.getElementById('arena-team-picker');
    if (!modal) return;
    const mode = modal.dataset.mode;
    const teamNum = window._arenaPickerSelected;
    if (!teamNum) return;

    if (mode === 'defense') {
      localStorage.setItem('arena_defense_team', JSON.stringify(teamNum));
      modal.remove();
      _showArenaInfoModal('Defense Team Set',
        `<p class="aim-note ok">Team ${teamNum} is now your defense team.</p>`);
      renderActionTiles();
      return;
    }

    // Offense: store and proceed to VS modal
    localStorage.setItem('arena_offense_team', JSON.stringify(teamNum));

    let enemyTeam = [];
    let resolvedTeams = {};
    try { enemyTeam = JSON.parse(modal.dataset.enemyTeam || '[]'); } catch(e) {}
    try { resolvedTeams = JSON.parse(modal.dataset.resolvedTeams || '{}'); } catch(e) {}
    modal.remove();

    const playerMembers = resolvedTeams[teamNum] || [];
    showTeamSelectorModal(playerMembers, enemyTeam);
  }

  function showTeamSelectorModal(playerMembers, enemyTeam) {
    // playerMembers: pre-resolved array of { name, version, portrait, rarity }
    // enemyTeam:     array from openArenaBattle

    const mapPath = randomMap();

    const rarityColor = r => r >= 6 ? '#ff4444' : r >= 5 ? '#ffd700' : r >= 4 ? '#a78bfa' : '#6bcf7f';

    const enemyHTML = enemyTeam.map(e => `
      <div class="arena-team-member">
        <div class="arena-member-avatar" style="${e.icon ? `background-image:url('${e.icon}');` : 'background:#333'}"></div>
        <div class="arena-member-name">${e.name}${e.version ? `<br><span>${e.version}</span>` : ''}</div>
        <div class="arena-member-stats">
          <span title="HP">HP ${(e.hp/1000).toFixed(1)}k</span>
          <span title="ATK">ATK ${e.atk}</span>
          <span title="SPD">SPD ${e.spd}</span>
        </div>
      </div>`).join('');

    const playerHTML = playerMembers.length > 0
      ? playerMembers.slice(0, 4).map(m => `
          <div class="arena-team-member">
            <div class="arena-member-avatar" style="${m.portrait ? `background-image:url('${m.portrait}');` : 'background:#444'}"></div>
            <div class="arena-member-name">${m.name}${m.version ? `<br><span>${m.version}</span>` : ''}</div>
          </div>`).join('')
      : '<div class="arena-no-team">No team set — default characters will be used</div>';

    const modal = document.createElement('div');
    modal.id = 'arena-team-modal';
    modal.innerHTML = `
      <div class="arena-modal-overlay" onclick="document.getElementById('arena-team-modal').remove()"></div>
      <div class="arena-modal-panel">
        <div class="arena-modal-header">
          <span class="arena-modal-title">Arena Battle</span>
          <button class="arena-modal-close" onclick="document.getElementById('arena-team-modal').remove()">✕</button>
        </div>
        <div class="arena-modal-body">
          <div class="arena-teams-row">
            <div class="arena-team-col">
              <div class="arena-team-label">Your Team</div>
              <div class="arena-team-grid">${playerHTML}</div>
            </div>
            <div class="arena-vs-badge">VS</div>
            <div class="arena-team-col">
              <div class="arena-team-label enemy-label">Enemy Team</div>
              <div class="arena-team-grid">${enemyHTML}</div>
            </div>
          </div>
          <div class="arena-map-preview" style="background-image:url('${mapPath}')">
            <span class="arena-map-label">Battle Map</span>
          </div>
        </div>
        <button class="arena-start-match-btn arena-pill-btn" onclick="startArenaBattle(${JSON.stringify(enemyTeam).replace(/"/g, '&quot;')}, '${mapPath}')">
          Fight!
        </button>
      </div>`;

    // Styles live in css/arena.css
    document.body.appendChild(modal);
  }

  function startArenaBattle(enemyTeam, mapPath) {
    localStorage.setItem('arena_battle_mode', '1');
    localStorage.setItem('arena_enemies', JSON.stringify(enemyTeam));
    localStorage.setItem('arena_map', mapPath);
    window.location.href = 'battle.html';
  }

  function toggleRanksTable() {
    const section = document.getElementById('ranking-section');
    if (!section) return;
    const isHidden = section.style.display === 'none';
    section.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      const history = document.getElementById('history-section');
      if (history) history.style.display = 'none';
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    _syncDrawerTiles();
  }

  function openDefenseSetup() {
    openArenaTeamPicker('defense');
  }

  // ── Season Rewards (claimable once per rank milestone) ──────────────────
  const SEASON_REWARD_MILESTONES = [
    { rank: 'Genin',          pearl: 10,  ryo: 5000,   shin: 2   },
    { rank: 'Chunin',         pearl: 20,  ryo: 10000,  shin: 5   },
    { rank: 'Jounin',         pearl: 50,  ryo: 25000,  shin: 10  },
    { rank: 'ANBU Captain',   pearl: 100, ryo: 50000,  shin: 20  },
    { rank: 'Kage',           pearl: 200, ryo: 100000, shin: 50  },
    { rank: 'Shinobi Legend', pearl: 500, ryo: 250000, shin: 100 },
  ];

  function getClaimedSeasonRewards() {
    try {
      const c = JSON.parse(localStorage.getItem('arena_rewards_claimed_v1') || '[]');
      return Array.isArray(c) ? c : [];
    } catch(e) { return []; }
  }

  function milestoneReached(rankName) {
    const list = buildRankList();
    const playerIdx = getCurrentRankIndex(getArenaStars()).idx;
    const milestoneIdx = list.findIndex(r => r.name === rankName);
    return milestoneIdx >= 0 && playerIdx >= milestoneIdx;
  }

  function claimSeasonReward(rankName) {
    const claimed = getClaimedSeasonRewards();
    if (claimed.includes(rankName) || !milestoneReached(rankName)) return;

    const reward = SEASON_REWARD_MILESTONES.find(m => m.rank === rankName);
    if (!reward || !window.Resources) return;

    window.Resources.add('ninja_pearls', reward.pearl);
    window.Resources.add('ryo', reward.ryo);
    window.Resources.add('shinobites', reward.shin);

    claimed.push(rankName);
    localStorage.setItem('arena_rewards_claimed_v1', JSON.stringify(claimed));

    // Re-render the modal with the updated claim state
    openSeasonRewards();
  }

  function openSeasonRewards() {
    const stars = getArenaStars();
    const { rank } = getCurrentRankIndex(stars);
    const claimed = getClaimedSeasonRewards();
    const pearlIcon = '<img src="assets/icons/currency/ninjapearl.png" alt="">';
    const ryoIcon   = '<img src="assets/icons/currency/ryo.png" alt="">';
    const shinIcon  = '<img src="assets/icons/currency/shinobite.png" alt="">';

    _showArenaInfoModal('Season Rewards',
      `<p class="sr-intro">Win battles to earn stars. Reach a rank to unlock its rewards.</p>
       <div class="sr-list">
         ${SEASON_REWARD_MILESTONES.map(r => {
           const isClaimed = claimed.includes(r.rank);
           const reached = milestoneReached(r.rank);
           let action;
           if (isClaimed) {
             action = '<span class="sr-claimed">Claimed</span>';
           } else if (reached) {
             action = `<button class="sr-claim arena-pill-btn" onclick="claimSeasonReward('${r.rank}')">Claim</button>`;
           } else {
             action = '<span class="sr-locked">Locked</span>';
           }
           const rowCls = reached && !isClaimed ? 'claimable' : (!reached ? 'locked' : '');
           return `
           <div class="sr-row ${rowCls}">
             <div style="min-width:0;flex:1">
               <div class="sr-rank">${r.rank}</div>
               <div class="sr-loot">
                 <span>${pearlIcon}${r.pearl}</span>
                 <span>${ryoIcon}${r.ryo.toLocaleString()}</span>
                 <span>${shinIcon}${r.shin}</span>
               </div>
             </div>
             ${action}
           </div>`;
         }).join('')}
       </div>
       <div class="sr-footer"><span>Current rank: <strong>${rank.label}</strong></span><span>${stars} ${starIco(14)}</span></div>`
    );
    renderActionTiles();
  }

  function _injectArenaTeamPickerStyles() {}

  function _showArenaInfoModal(title, bodyHTML) {
    document.getElementById('arena-info-modal')?.remove();
    const modal = document.createElement('div');
    modal.id = 'arena-info-modal';
    modal.innerHTML = `
      <div class="aim-overlay" onclick="document.getElementById('arena-info-modal').remove()"></div>
      <div class="aim-panel">
        <div class="aim-header">
          <span class="aim-title">${title}</span>
          <button class="aim-close" onclick="document.getElementById('arena-info-modal').remove()">✕</button>
        </div>
        <div class="aim-body">${bodyHTML}</div>
      </div>`;
    document.body.appendChild(modal);
  }
</script>

  <script src="js/navigation.js"></script>
