<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Ninja Legends — Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Page loader: covers the page until its art, fonts and data are in -->
  <link rel="stylesheet" href="css/page-loader.css" />
  <script src="js/session-gate.js"></script>
  <script src="js/page-loader.js"></script>
  <script src="js/device-detect.js"></script>
  <script src="js/ui-theme.js"></script>
  <script src="js/modal-manager.js?v=3"></script>
  <!-- PWA App Container -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ninja Legends" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app/favicon-32.png" />
  <script src="js/pwa-register.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme-jjk.css" />
  <link rel="stylesheet" href="css/shop.css" />
  <link rel="stylesheet" href="css/recipe-scroll.css" />
  <link rel="stylesheet" href="css/skins.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/bottombar.css" />
  <link rel="stylesheet" href="css/music-player.css" />
  <!-- Hide scrollbar but keep functionality -->
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    body::-webkit-scrollbar,
    html::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    body, html, * {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/help-tip.css" />
  <script src="js/help-tip.js"></script>
  <link rel="stylesheet" href="css/ui-glass.css" />
  <link rel="stylesheet" href="css/glass/shop.css" />
  <link rel="stylesheet" href="css/ui-ink.css" />
  <link rel="stylesheet" href="css/ink/shop.css" />
</head>
<body class="page-shop">
  <header class="jjk-page-header">
    <a class="jjk-icon-btn jjk-back" href="village.html" aria-label="Back to Village"><img src="assets/ui/jjk/back_arrow.webp" alt="" /></a>
    <h1 data-ink-sub="商店 · Supplies" class="jjk-title-plate">Shop</h1>
  </header>
  <div id="shop-bg"></div>

  <!-- Resource Display -->
  <div class="resource-bar">
    <div class="resource-item">
      <img src="assets/icons/currency/ninjapearl.png" alt="Ninja Pearls" class="resource-icon" onerror="this.style.display='none'">
      <span class="resource-label">Ninja Pearls:</span>
      <span id="currency-ninja-pearls" class="resource-value">0</span>
    </div>
    <div class="resource-item">
      <img src="assets/icons/currency/shinobite.png" alt="Shinobites" class="resource-icon" onerror="this.style.display='none'">
      <span class="resource-label">Shinobites:</span>
      <span id="currency-shinobites" class="resource-value">0</span>
    </div>
    <div class="resource-item">
      <img src="assets/icons/currency/ryo.png" alt="Ryo" class="resource-icon" onerror="this.style.display='none'">
      <span class="resource-label">Ryo:</span>
      <span id="currency-ryo" class="resource-value">0</span>
    </div>
    <div class="resource-item">
      <span class="resource-icon granny-coin-icon" role="img" aria-label="Granny Coins"></span>
      <span class="resource-label">Granny Coins:</span>
      <span id="currency-granny-coins" class="resource-value">0</span>
    </div>
  </div>

  <main class="shop-content">

    <!-- Shop Tabs -->
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="ramen">Training Ramen</button>
      <button class="shop-tab" data-tab="materials">Materials</button>
      <button class="shop-tab" data-tab="resources">Resources</button>
      <button class="shop-tab" data-tab="granny">Granny Cat Shop</button>
      <button class="shop-tab" data-tab="recipes">Recipe Scrolls</button>
      <button class="shop-tab" data-tab="limitbreak">Limit Break</button>
      <button class="shop-tab" data-tab="skins">Skins</button>
    </div>

    <!-- Ramen Tab -->
    <div class="shop-tab-content active" id="tab-ramen">
      <div class="shop-grid" id="ramen-grid"></div>
    </div>

    <!-- Materials Tab -->
    <div class="shop-tab-content" id="tab-materials">
      <div class="shop-grid" id="materials-grid"></div>
    </div>

    <!-- Resources Tab -->
    <div class="shop-tab-content" id="tab-resources">
      <div class="shop-grid" id="resources-grid"></div>
    </div>

    <!-- Granny Cat Shop Tab -->
    <div class="shop-tab-content" id="tab-granny">
      <div class="shop-grid" id="granny-grid"></div>
    </div>

    <!-- Recipe Scrolls Tab (js/recipe-book.js) -->
    <div class="shop-tab-content" id="tab-recipes">
      <div class="rc-shop-status">
        <span>Recipes owned <b id="rc-shop-owned">0 / 0</b></span>
        <span>Recipe Fragments <b id="rc-shop-fragments">0</b></span>
      </div>
      <div class="shop-grid" id="recipes-grid"></div>
    </div>

    <!-- Limit Break Tab: character crystals (data/lb-crystals.json, js/lb-shop.js) -->
    <div class="shop-tab-content" id="tab-limitbreak">
      <div class="lb-toolbar">
        <label class="lb-search">
          <span class="lb-visually-hidden">Search characters</span>
          <svg class="lb-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input type="search" id="lb-search" placeholder="Search character" autocomplete="off" spellcheck="false" />
          <button type="button" class="lb-search-clear" id="lb-search-clear" aria-label="Clear search" hidden>&times;</button>
        </label>
        <div class="lb-seg" id="lb-variant" role="group" aria-label="Crystal grade">
          <button type="button" class="lb-seg-btn is-on" data-variant="all" aria-pressed="true">All</button>
          <button type="button" class="lb-seg-btn" data-variant="blue" aria-pressed="false">Blue ★5</button>
          <button type="button" class="lb-seg-btn" data-variant="gold" aria-pressed="false">Gold ★6</button>
        </div>
        <label class="lb-sort">
          <span>Sort</span>
          <select id="lb-sort">
            <option value="name">Name</option>
            <option value="element">Element</option>
            <option value="price">Price</option>
            <option value="owned">Owned</option>
          </select>
        </label>
      </div>
      <div class="lb-elements" id="lb-elements" role="group" aria-label="Filter by element">
        <button type="button" class="lb-el" data-el="Heart" aria-pressed="false"><img src="assets/ui/jjk/orb_heart.webp" alt="" width="22" height="22">Heart</button>
        <button type="button" class="lb-el" data-el="Skill" aria-pressed="false"><img src="assets/ui/jjk/orb_skill.webp" alt="" width="22" height="22">Skill</button>
        <button type="button" class="lb-el" data-el="Body" aria-pressed="false"><img src="assets/ui/jjk/orb_body.webp" alt="" width="22" height="22">Body</button>
        <button type="button" class="lb-el" data-el="Bravery" aria-pressed="false"><img src="assets/ui/jjk/orb_bravery.webp" alt="" width="22" height="22">Bravery</button>
        <button type="button" class="lb-el" data-el="Wisdom" aria-pressed="false"><img src="assets/ui/jjk/orb_wisdom.webp" alt="" width="22" height="22">Wisdom</button>
        <span class="lb-count" id="lb-count" aria-live="polite"></span>
        <button type="button" class="help-tip" aria-label="How crystals work" data-help-title="Limit Break Crystals" data-help="Each crystal fits one character, in every version. Blue ★5 crystals work at 6★ tiers; gold ★6 crystals work at every tier. They are spent before generic Limit Break Crystals.">?</button>
      </div>
      <div class="lb-grid" id="limitbreak-grid"></div>
      <div class="lb-empty" id="lb-empty" hidden>
        <img src="assets/items/limitbreakcrystal_portrait.webp" alt="" width="72" height="72">
        <p class="lb-empty-title" id="lb-empty-title">No crystals match</p>
        <p class="lb-empty-sub" id="lb-empty-sub">Try another name or clear the element filters.</p>
        <button type="button" class="jjk-btn" id="lb-reset">Clear filters</button>
      </div>
    </div>

    <!-- Skins Tab: cosmetic skins (js/skins.js, js/skin-shop.js) -->
    <div class="shop-tab-content" id="tab-skins">
      <div class="help-row"><button type="button" class="help-tip" aria-label="How skins work" data-help-title="Skins" data-help="Skins change how a unit looks in battle and on its info screen. Stats stay the same. Equip skins from the unit's info screen in Shinobi.">?</button></div>
      <div class="skin-grid" id="skins-grid"></div>
      <p class="lb-rule" id="skins-empty" hidden>No skins on sale yet.</p>
    </div>
  </main>

  <!-- Purchase confirm / result: themed dialog (css/modal-system.css), shop layout in css/shop.css (.sp-*) -->
  <div id="purchase-modal" class="modal sp-modal hidden">
    <div class="modal-container modal-show sp-dialog" role="dialog" aria-modal="true" aria-labelledby="sp-confirm-title">
      <div class="modal-header"><h3 class="modal-title" id="sp-confirm-title">Purchase</h3></div>
      <div class="modal-body sp-body">
        <div class="sp-item">
          <span class="sp-icon"><img id="purchase-item-icon" src="" alt=""></span>
          <div class="sp-text">
            <div class="sp-name" id="purchase-item-name"></div>
            <div class="sp-desc" id="purchase-item-desc"></div>
          </div>
        </div>
        <div class="sp-row">
          <div class="quantity-selector sp-qty">
            <button type="button" class="qty-btn" id="qty-minus" aria-label="Fewer">&minus;</button>
            <input type="number" id="qty-input" value="1" min="1" max="99" aria-label="Quantity">
            <button type="button" class="qty-btn" id="qty-plus" aria-label="More">+</button>
          </div>
          <div class="sp-cost"><span id="purchase-total-cost"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-btn modal-btn-secondary" id="btn-cancel-purchase">Cancel</button>
        <button type="button" class="modal-btn modal-btn-primary jjk-btn" id="btn-confirm-purchase">Buy</button>
      </div>
    </div>
  </div>

  <div id="success-modal" class="modal sp-modal hidden">
    <div class="modal-container modal-show sp-dialog sp-done" role="dialog" aria-modal="true" aria-labelledby="sp-done-title">
      <div class="modal-header"><h3 class="modal-title" id="sp-done-title">Obtained</h3></div>
      <div class="modal-body sp-body">
        <div class="sp-reward">
          <span class="sp-icon is-big"><img id="success-item-icon" src="" alt=""><b class="sp-count" id="success-item-qty"></b></span>
          <div class="sp-name" id="success-message"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-btn modal-btn-primary jjk-btn" id="btn-close-success">OK</button>
      </div>
    </div>
  </div>

  <!-- HUD Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-content">
      <button class="hud-button" id="btn-village" aria-label="Village">
        <img src="assets/icons/nav/village_btm_btn.png" alt="Village">
      </button>
      <button class="hud-button" id="btn-characters" aria-label="Shinobi">
        <img src="assets/icons/nav/characters_icon.png" alt="Characters" onerror="this.style.display='none'">
      </button>
      <button class="hud-button" id="btn-fusion" aria-label="Fusion">
        <img src="assets/icons/nav/fusion_btm_btn.png" alt="Fusion">
      </button>
      <button class="hud-button" id="btn-teams" aria-label="Teams">
        <img src="assets/icons/nav/teams_icon.png" alt="Teams">
      </button>
      <button class="hud-button" id="btn-tools" aria-label="Tools">
        <img src="assets/icons/nav/guilds_icon.png" alt="Tools">
      </button>
      <button class="hud-button" id="btn-summon" aria-label="Summon">
        <img src="assets/icons/nav/summon_btm_btn.png" alt="Summon">
      </button>
      <button class="hud-button" id="btn-missions" aria-label="Missions">
        <img src="assets/icons/nav/mission_btm_btn.png" alt="Missions">
      </button>
      <button class="hud-button" id="btn-inventory" aria-label="Items">
        <img src="assets/icons/nav/inventory_icon.png" alt="Inventory">
      </button>
      <button class="hud-button active" id="btn-shop" aria-label="Shop">
        <img src="assets/icons/nav/shop_btm_btn.png" alt="Shop">
      </button>
    </div>
  </div>

  <script src="js/vendor/howler.min.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/recipe-book.js"></script>
  <script src="js/recipe-scroll.js"></script>
  <script src="js/lb-crystals.js"></script>
  <script defer src="js/skins.js"></script>
  <script defer src="js/skin-shop.js"></script>
  <script defer src="js/shop.js"></script>
  <script defer src="js/lb-shop.js"></script>

  <!-- Navigation Script -->
  <script src="js/navigation.js"></script>

  <!-- Music Initialization -->
  <script>
    // Music initialization - start BGM on page load
    (function() {
      if (typeof window.AudioManager === 'undefined') {
        console.log('[Music] AudioManager not available on this page');
        return;
      }

      console.log('[Music] Initializing background music...');

      const startMusic = () => {
        if (!window.AudioManager.musicPlaying) {
          window.AudioManager.playBattleMusic();
        }
      };

      // Try immediate playback (may be blocked by browser)
      setTimeout(startMusic, 500);

      // Also try on first click
      document.addEventListener('click', startMusic, { once: true });
    })();
  </script>
</body>
</html>
