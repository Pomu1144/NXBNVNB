  <!-- The hub's first screen doesn't draw from characters.json (only the tier
       check and panel-mission names use it), so the loader doesn't wait for it. -->
  <meta name="page-loader-skip" content="data/characters.json" />
  <script src="js/device-detect.js"></script>
  <script src="js/ui-theme.js"></script>
  <script src="js/dev-mode.js"></script>

  <meta name="apple-mobile-web-app-title" content="Ninja Legends" />

  <script src="js/pwa-register.js"></script>
  <script src="js/session-gate.js"></script>
  <!-- Warm the cache for cards.json while idle on the hub, so the first jump
       to Characters / Teams is instant; the service worker serves it from
       cache on later visits. Added once the page loader has lifted, so it
       doesn't share the first visit's bandwidth with the hub's own data.
       characters.json is not prefetched: the hub fetches it itself, and a
       low-priority prefetch of the same file made that fetch wait behind it. -->
  <script>
    (window.PageLoader ? window.PageLoader.ready : Promise.resolve()).then(() => {
      const l = document.createElement('link');
      l.rel = 'prefetch'; l.href = 'data/cards.json'; l.as = 'fetch'; l.crossOrigin = 'anonymous';
      document.head.appendChild(l);
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      console.log("✅ JavaScript loaded!");

      // Initialize username display
      const usernameDisplay = document.getElementById("username-display");
      if (usernameDisplay && typeof window.UserProfile !== "undefined") {
        const username = window.UserProfile.getUsername();
        usernameDisplay.textContent = username;
        console.log(`👤 Username loaded: ${username}`);

        // Listen for username changes
        window.addEventListener("usernameChanged", (e) => {
          usernameDisplay.textContent = e.detail.username;
          console.log(`👤 Username updated: ${e.detail.username}`);
        });
      }

      // Initialize Dashboard Systems
      console.log("🎮 Initializing Dashboard Systems...");

      // Initialize Calendar and Daily Streak
      if (window.DashboardCalendar) {
        window.DashboardCalendar.init();
        await updateDailyLoginDisplay();
      }

      // Initialize Mailbox
      if (window.DashboardMailbox) {
        try { window.DashboardMailbox.init(); } catch(e) { console.error('[village] Mailbox init failed:', e); }
        updateMailboxBadge();
      } else {
        console.error('[village] DashboardMailbox not loaded — check js/dashboard-mailbox.js');
      }

      // Initialize Stats
      if (window.DashboardStats) {
        await window.DashboardStats.init();
        updateCollectionStats();
      }

      // Initialize Announcements
      if (window.DashboardAnnouncements) {
        await window.DashboardAnnouncements.init('announcement-banner-container');
      }

      // Initialize Banner Slideshow
      if (window.DashboardBannerSlideshow) {
        await window.DashboardBannerSlideshow.init('dashboard-banner-slideshow');
      }

      // Initialize Announcement Slideshow (Top Right)
      if (window.AnnouncementSlideshow) {
        await window.AnnouncementSlideshow.init();
      }

      // Initialize Panel Missions
      if (window.PanelMissions) {
        await window.PanelMissions.init();
      }

      // Update Ninja Rank Progress Bar
      updateRankProgressBar();

      // Process login bonus
      if (typeof window.DailyMissions !== "undefined") {
        // Show the bonus once the page loader has lifted, not underneath it.
        if (window.PageLoader) await window.PageLoader.ready;
        const loginResult = await window.DailyMissions.processLogin();
        if (loginResult.ok && !loginResult.alreadyClaimed) {
          const reward = loginResult.reward || {};
          const items = window.RewardFormat ? window.RewardFormat.items(reward) : [];
          const streak = loginResult.loginStreak > 1 ? `${loginResult.loginStreak}-day streak` : '';
          if (items.length && window.DashboardMailbox && typeof window.DashboardMailbox.showRewardReveal === 'function') {
            window.DashboardMailbox.showRewardReveal(items, { title: `Login Bonus · Day ${loginResult.loginDay}`, note: streak });
          } else if (window.ModalManager) {
            const rewardText = Object.entries(reward)
              .map(([mat, amt]) => `${window.RewardFormat ? window.RewardFormat.name(mat) : mat} ×${Number(amt).toLocaleString()}`)
              .join('\n');
            window.ModalManager.showInfo(`Day ${loginResult.loginDay} rewards:\n${rewardText}`, null, { title: 'Login Bonus' });
          }
        }
      }
      // Login bonus is up (or not due): the tutorial may start after it.
      document.body.dataset.loginBonus = 'done';

      // ===== HELPER FUNCTIONS =====

      async function updateDailyLoginDisplay() {
        if (!window.DashboardCalendar) return;
        const streak = window.DashboardCalendar.getStreak();
        const dayElement = document.getElementById('daily-login-day');
        const indicator = document.getElementById('daily-login-indicator');

        if (dayElement) {
          dayElement.textContent = `Day ${streak}/7`;
        }

        // Add notification dot if login bonus is available
        if (window.DailyMissions) {
          const loginStatus = await window.DailyMissions.getLoginStatus();
          if (loginStatus && !loginStatus.claimedToday) {
            indicator?.classList.add('has-reward');
          }
        }
      }

      window.addEventListener('mailboxUpdated', () => updateMailboxBadge());

      function updateMailboxBadge() {
        if (!window.DashboardMailbox) return;
        const unreadCount = window.DashboardMailbox.getUnreadCount();
        const badge = document.getElementById('mailbox-badge');
        const presentNotification = document.getElementById('present-box-notification');

        if (badge) {
          if (unreadCount > 0) {
            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            badge.style.display = 'flex';
          } else {
            badge.style.display = 'none';
          }
        }

        // Show red orb on present box icon if there are any messages
        if (presentNotification) {
          if (unreadCount > 0) {
            presentNotification.style.display = 'block';
          } else {
            presentNotification.style.display = 'none';
          }
        }
      }

      function updateCollectionStats() {
        if (!window.DashboardStats) return;
        const percentage = window.DashboardStats.getCollectionPercentage();
        const valueElement = document.getElementById('collection-value');

        if (valueElement) {
          valueElement.textContent = percentage.toFixed(1) + '%';
        }
      }

      function updateRankProgressBar() {
        if (!window.NinjaRank) return;

        const progress = window.NinjaRank.getExpProgress();
        const expToNext = window.NinjaRank.getExpToNextRank();
        const isMax = window.NinjaRank.isMaxRank();

        const fillElement = document.getElementById('level-progress-fill');
        const textElement = document.getElementById('rank-progress-text');

        if (fillElement) {
          fillElement.style.width = (progress * 100).toFixed(1) + '%';
        }

        if (textElement) {
          textElement.textContent = isMax ? 'MAX' : `${expToNext} to next`;
        }
      }

      function navigateTo(url) {
        console.log(`🚀 Navigating to: ${url}`);
        document.body.style.transition = "opacity 0.2s linear";
        document.body.style.opacity = "0";
        setTimeout(() => {
          window.location.href = url;
        }, 200);
      }

      // ===== BACKGROUND CYCLING SYSTEM =====

      const bgElement = document.getElementById("full-bg");
      let currentBackground = window.VillageBackgrounds ? VillageBackgrounds.savedId() : 1;

      // Show and remember a background (same choice as the Settings picker)
      function updateBG(n) {
        if (!bgElement || !window.VillageBackgrounds) return;
        VillageBackgrounds.apply(bgElement, n);
        VillageBackgrounds.save(n);
        console.log(`🎨 Background changed to bg-${n}`);
      }

      // ===== RIGHT BANNER PANEL NAVIGATION =====

      const bannerButtons = document.querySelectorAll('.right-banner-panel .banner-button');
      bannerButtons.forEach(button => {
        button.addEventListener('click', () => {
          const action = button.classList[1]; // missions, characters, summon, fusion, shop
          console.log(`🎯 Banner clicked: ${action}`);

          switch(action) {
            case 'missions':
              navigateTo('missions.html');
              break;
            case 'characters':
              navigateTo('characters.html');
              break;
            case 'summon':
              navigateTo('summon.html');
              break;
            case 'fusion':
              navigateTo('fusion.html');
              break;
            case 'shop':
              navigateTo('shop.html');
              break;
            case 'arena':
              navigateTo('arena.html');
              break;
            case 'ninja-road':
              navigateTo('ninja-road.html');
              break;
          }
        });
      });

      // Glass style menu: same destinations as the banner buttons
      document.querySelectorAll('.hv-menu [data-go]').forEach(tile => {
        tile.addEventListener('click', () => {
          document.querySelector(`.right-banner-panel .banner-button.${tile.dataset.go}`)?.click();
        });
      });

      // Ink style home: rail / cards / Enter reuse the banner buttons; the
      // top-right icons reuse the dock; the grid icon shows the full dock
      document.querySelectorAll('.ink-home [data-ink-go]').forEach(el => {
        el.addEventListener('click', () => {
          const go = el.dataset.inkGo;
          if (go === 'home') return;
          document.querySelector(`.right-banner-panel .banner-button.${go}`)?.click();
        });
      });
      document.querySelectorAll('.ink-home [data-ink-act]').forEach(el => {
        el.addEventListener('click', () => {
          const act = el.dataset.inkAct;
          if (act === 'menu') {
            const open = document.documentElement.classList.toggle('ink-dock-open');
            el.setAttribute('aria-expanded', String(open));
            return;
          }
          document.querySelector(`.bottom-icon[data-action="${act}"]`)?.click();
        });
      });
      fetch('data/announcements.json').then(r => r.json()).then(data => {
        const box = document.getElementById('ink-news-list');
        const list = (Array.isArray(data) ? data : (data && data.announcements) || [])
          .slice().sort((a, b) => String(b.dateStart).localeCompare(String(a.dateStart)));
        if (!box || !list.length) return;
        const fmt = (d) => { const t = new Date(d); return isNaN(t) ? '' : `${String(t.getMonth() + 1).padStart(2, '0')}/${String(t.getDate()).padStart(2, '0')}`; };
        box.replaceChildren(...list.slice(0, 3).map(a => {
          const row = document.createElement('span');
          const date = document.createElement('time'); date.textContent = fmt(a.dateStart);
          const title = document.createElement('span'); title.textContent = a.title || '';
          row.append(date, title);
          return row;
        }));
      }).catch(() => {});

      // ===== BOTTOM ICON BAR NAVIGATION =====

      const bottomIcons = document.querySelectorAll('.bottom-icon');
      bottomIcons.forEach(icon => {
        icon.addEventListener('click', () => {
          const action = icon.dataset.action;
          console.log(`🔷 Bottom icon clicked: ${action}`);

          switch(action) {
            case 'notice':
              if (window.ModalManager) { window.ModalManager.showInfo('📢 Notice Board\n\nNo new notices at this time.'); }
              break;
            case 'presents':
              if (window.DashboardMailbox) {
                window.DashboardMailbox.openMailbox();
              } else {
                if (window.ModalManager) { window.ModalManager.showInfo('🎁 Present Box\n\nPresent box system not loaded. Please reload the page.'); }
              }
              break;
            case 'achievements':
              if (window.Achievements) {
                window.Achievements.openAchievementsModal();
              } else {
                if (window.ModalManager) { window.ModalManager.showInfo('🏆 Achievements\n\nAchievement system not loaded. Please reload.'); }
              }
              break;
            case 'panel-missions':
              if (window.PanelMissions) {
                window.PanelMissions.openPanelModal();
              } else {
                if (window.ModalManager) { window.ModalManager.showInfo('📋 Panel Missions\n\nPanel missions system not loaded. Please reload the page.'); }
              }
              break;
            case 'chat':
              if (window.ModalManager) { window.ModalManager.showInfo('💬 Chat\n\nChat system coming soon!'); }
              break;
            case 'inventory':
              navigateTo('inventory.html');
              break;
            case 'teams':
              navigateTo('teams.html');
              break;
            case 'resources':
              navigateTo('resources.html');
              break;
            case 'tools':
              navigateTo('tools.html');
              break;
            case 'settings':
              navigateTo('settings.html');
              break;
          }
        });
      });

      // ===== MUSIC INITIALIZATION =====
      // Start background music using AudioManager
      if (typeof window.AudioManager !== 'undefined') {
        console.log('🎵 Starting background music...');

        // Try to play after user interaction
        const startMusic = () => {
          window.AudioManager.playBattleMusic();
        };

        // Add one-time click listener to start music
        document.addEventListener('click', () => {
          if (!window.AudioManager.musicPlaying) {
            startMusic();
          }
        }, { once: true });

        // Also try immediately (may be blocked by browser autoplay policy)
        setTimeout(() => {
          if (!window.AudioManager.musicPlaying) {
            startMusic();
          }
        }, 1000);
      } else {
        console.error('❌ AudioManager not found - music cannot play');
      }

      console.log("✅ All systems initialized!");
    });
  </script>

      </div><!-- .game-content -->
    </div><!-- .game-canvas -->
  </div><!-- .game-canvas-wrapper -->
  <!-- First-time tutorial (steps: js/tutorial-steps.js) -->
  <script src="js/tutorial-steps.js"></script>
  <script src="js/tutorial.js"></script>
</body>
</html>
